<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes · MoveIt</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="mask-icon" href="/favicon-mask.svg" color="#0ea5e9">
    <style>
        @font-face {
            font-family: 'Bricolage Grotesque';
            src: url('/fonts/bricolage-grotesque-800.woff2') format('woff2');
            font-weight: 800;
            font-display: swap;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            background: #f8fafc;
            color: #0f172a;
            padding: 20px;
        }

        .page { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

        .page-header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

        .wordmark {
            font-family: 'Bricolage Grotesque', -apple-system, sans-serif;
            font-weight: 800;
            font-size: 17px;
            color: #0f172a;
            text-decoration: none;
            letter-spacing: -0.02em;
        }
        .wordmark span { color: #0ea5e9; }
        .page-meta { font-size: 12px; color: #64748b; margin-left: auto; }
        .page-meta b { color: #475569; font-weight: 600; }

        .theme-toggle {
            width: 26px; height: 26px; border-radius: 50%;
            border: 1px solid #e2e8f0; background: #fff; color: #0284c7;
            font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .theme-toggle:hover { border-color: #bae6fd; }

        /* The composer is the lists page's: one line, type and go. Enter
           starts the note and drops you on its blank line to keep writing. */
        .composer {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .composer:focus-within { border-color: #bae6fd; }
        .composer input {
            flex: 1;
            border: none;
            font: inherit;
            font-size: 13px;
            color: #0f172a;
            background: transparent;
        }
        .composer input:focus { outline: none; }
        .composer input::placeholder { color: #0284c7; opacity: 1; }
        .lede { font-size: 12px; color: #64748b; line-height: 1.6; margin-top: -6px; }

        .btn {
            border: 1px solid #e2e8f0;
            background: #fff;
            color: #0284c7;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
        }
        .btn:hover { border-color: #bae6fd; background: #f0f9ff; }
        .btn.primary { background: #0ea5e9; border-color: #0ea5e9; color: #fff; }
        .btn.primary:hover { background: #0284c7; border-color: #0284c7; }
        .btn:disabled { opacity: .5; cursor: default; }

        .toolbar { display: flex; align-items: center; gap: 12px; font-size: 12px; color: #64748b; }
        .toolbar label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .toolbar input { accent-color: #0ea5e9; }
        .toolbar .count { margin-left: auto; }

        /* One card per note. CSS columns give a masonry without a script;
           each card refuses to split across columns. */
        .cards { columns: 3 260px; column-gap: 14px; }
        .card {
            break-inside: avoid;
            display: inline-block;
            width: 100%;
            margin: 0 0 14px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 14px 10px;
            animation: rise .18s ease-out;
        }
        @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
        .card.archived { opacity: .55; }
        /* Blue edge: a note's colour, as pink is a list's. A note newer than
           your last visit wears the full-strength blue. */
        .card { border-left: 3px solid #bae6fd; }
        .card.fresh { border-left-color: #0ea5e9; }
        /* Always editable (Kevin, 2026-10-01): no Edit button. The text is a
           borderless field that grows with it and saves as you type. */
        .card textarea.note-text {
            display: block;
            width: 100%;
            border: none;
            padding: 0;
            resize: none;
            overflow: hidden;
            font: inherit;
            font-size: 13px;
            line-height: 1.55;
            color: #0f172a;
            background: transparent;
        }
        .card textarea.note-text:focus { outline: none; }
        /* The blank line at the bottom, the list card's add-item slot. Enter
           adds it to the note and leaves you on a fresh one. */
        .card input.addline {
            width: 100%;
            margin-top: 6px;
            border: 1px dashed #e2e8f0;
            border-radius: 6px;
            padding: 4px 7px;
            font: inherit;
            font-size: 12px;
            color: #0f172a;
            background: #fff;
        }
        .card input.addline:focus { outline: none; border-color: #38bdf8; border-style: solid; }
        .card input.addline::placeholder { color: #94a3b8; }
        /* A field can't show a link, so the note's links and pictures sit
           under the text, live. */
        .note-links { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; font-size: 12px; }
        .note-links:empty { display: none; }
        .note-links a { color: #0284c7; overflow-wrap: anywhere; }
        .note-links img { max-width: 100%; border-radius: 6px; display: block; }
        .saved { font-size: 11px; color: #94a3b8; }
        .card-foot {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px solid #f1f5f9;
            font-size: 11px;
            color: #94a3b8;
        }
        .card-foot .when { white-space: nowrap; }
        .card-foot .src {
            padding: 1px 6px;
            border-radius: 999px;
            background: #f0f9ff;
            color: #0284c7;
            font-weight: 600;
            font-size: 10px;
            letter-spacing: .02em;
        }
        .card-foot { flex-wrap: wrap; }
        .card-acts { margin-left: auto; display: flex; gap: 2px; }
        .card-acts button {
            white-space: nowrap;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 11px;
            padding: 2px 5px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
        }
        .card-acts button:hover { color: #0284c7; background: #f0f9ff; }
        .card-acts button.danger:hover { color: #ef4444; background: #fef2f2; }

        .empty {
            background: #fff;
            border: 1px dashed #e2e8f0;
            border-radius: 12px;
            padding: 22px;
            text-align: center;
            color: #64748b;
            line-height: 1.6;
        }
        .empty b { color: #0f172a; font-weight: 600; }
        .empty code { font-size: 12px; color: #0284c7; }

        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: #0f172a; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 12px;
            opacity: 0; transition: all .2s; pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%); }

        body.dark { background: #0f172a; color: #e2e8f0; }
        body.dark .wordmark { color: #f1f5f9; }
        body.dark .page-meta b { color: #cbd5e1; }
        body.dark .theme-toggle { background: #1e293b; border-color: #334155; color: #38bdf8; }
        body.dark .composer, body.dark .card, body.dark .empty { background: #1e293b; border-color: #334155; }
        body.dark .composer:focus-within { border-color: #0284c7; }
        body.dark .composer input, body.dark .card textarea.note-text, body.dark .empty b { color: #e2e8f0; }
        body.dark .composer input::placeholder { color: #38bdf8; }
        body.dark .card input.addline { background: #0f172a; border-color: #334155; color: #e2e8f0; }
        body.dark .card input.addline:focus { border-color: #0284c7; }
        body.dark .card input.addline::placeholder { color: #64748b; }
        body.dark .note-links a { color: #38bdf8; }
        body.dark .lede { color: #94a3b8; }
        body.dark .btn { background: #1e293b; border-color: #334155; color: #38bdf8; }
        body.dark .btn:hover { background: #0f172a; border-color: #0284c7; }
        body.dark .btn.primary { background: #0ea5e9; border-color: #0ea5e9; color: #fff; }
        body.dark .card-foot { border-top-color: #334155; }
        body.dark .card-foot .src { background: #0f172a; color: #38bdf8; }
        body.dark .card-acts button:hover { background: #0f172a; }
        body.dark .card-acts button.danger:hover { background: #3f1d1d; }
        body.dark .card { border-left-color: #0c4a6e; }
        body.dark .card.fresh { border-left-color: #0ea5e9; }
        body.dark .toast { background: #f1f5f9; color: #0f172a; }
    </style>
</head>
<body>
    <script src="/nav.js"></script>
    <div class="page">

        <div class="composer">
            <input id="composer" type="text" placeholder="Start a note — a quote, an idea, something to build…" autocomplete="off">
        </div>
        <div class="lede">Enter starts the note and opens a blank line under it. From your phone: “Claude, send a note to MoveIt that says …”</div>

        <div class="toolbar">
            <label><input type="checkbox" id="showArchived"> Show archived</label>
            <span class="count" id="count"></span>
        </div>

        <div id="cards" class="cards"></div>
        <div id="empty" class="empty" hidden></div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        // ---- theme, synced with the board ----
        const THEME_KEY = 'movealong.theme';
        function applyTheme() {
            const dark = localStorage.getItem(THEME_KEY) === 'dark';
            document.body.classList.toggle('dark', dark);
            document.getElementById('themeToggle').textContent = dark ? '☀️' : '🌙';
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            localStorage.setItem(THEME_KEY, document.body.classList.contains('dark') ? 'light' : 'dark');
            applyTheme();
        });
        applyTheme();

        function session() {
            try { return JSON.parse(localStorage.getItem('movealong.session') || 'null'); }
            catch (e) { return null; }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text == null ? '' : String(text);
            return div.innerHTML;
        }

        // Links in a note: the same matching a task page's notes use.
        const URL_RE = /(?:https?:\/\/|www\.)[^\s<>"']+/gi;
        const IMG_RE = /\.(png|jpe?g|gif|webp)(\?[^\s]*)?$/i;

        async function api(path, { method = 'GET', body } = {}) {
            const headers = { 'Content-Type': 'application/json' };
            try { headers['x-tz'] = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { /* UTC */ }
            const res = await fetch('/api' + path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
            return data;
        }

        let toastTimer = null;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
        }

        function whenLabel(iso) {
            const d = new Date(iso);
            if (isNaN(d)) return '';
            const today = new Date().toLocaleDateString('en-CA');
            const day = d.toLocaleDateString('en-CA');
            const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
            if (day === today) return `today · ${time}`;
            const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
            if (day === yesterday.toLocaleDateString('en-CA')) return `yesterday · ${time}`;
            const sameYear = d.getFullYear() === new Date().getFullYear();
            return d.toLocaleDateString([], sameYear ? { month: 'short', day: 'numeric' } : { month: 'short', day: 'numeric', year: 'numeric' });
        }

        const sess = session();
        const me = sess ? `/companies/${encodeURIComponent(sess.subdomain)}/users/${encodeURIComponent(sess.slug)}` : null;
        let notes = [];
        // Notes newer than the last visit get a blue edge, once.
        const SEEN_KEY = 'movealong.notes.seen';
        const lastSeen = localStorage.getItem(SEEN_KEY) || '';

        async function load() {
            if (!me) {
                document.getElementById('empty').hidden = false;
                document.getElementById('empty').innerHTML = 'Sign in on <a href="/">your board</a> first — this page reads the account from that tab.';
                return;
            }
            const archived = document.getElementById('showArchived').checked;
            notes = await api(`${me}/notes${archived ? '?archived=1' : ''}`);
            render();
        }

        function render() {
            const cards = document.getElementById('cards');
            const empty = document.getElementById('empty');
            const live = notes.filter(n => !n.archived_at).length;
            document.getElementById('count').textContent = notes.length
                ? `${live} note${live === 1 ? '' : 's'}${notes.length > live ? ` · ${notes.length - live} archived` : ''}`
                : '';
            if (!notes.length) {
                cards.innerHTML = '';
                empty.hidden = false;
                empty.innerHTML = `<b>Nothing here yet.</b><br>Type one above, or from your phone say <code>Claude, send a note to MoveIt that says …</code>`;
                return;
            }
            empty.hidden = true;
            cards.innerHTML = notes.map(n => {
                const fresh = lastSeen && n.created_at > lastSeen && !n.archived_at;
                const acts = n.archived_at
                    ? `<button data-act="unarchive" data-id="${n.id}">Restore</button><button class="danger" data-act="delete" data-id="${n.id}" title="Delete for good">Delete</button>`
                    : `<button data-act="task" data-id="${n.id}" title="Put this on today's card of your first board">Make it a task</button><button data-act="archive" data-id="${n.id}">Archive</button>`;
                return `
                    <div class="card ${n.archived_at ? 'archived' : ''} ${fresh ? 'fresh' : ''}" data-id="${n.id}">
                        <textarea class="note-text" data-id="${n.id}" rows="1" spellcheck="true"${n.archived_at ? ' readonly' : ''}>${escapeHtml(n.body)}</textarea>
                        <div class="note-links">${linksFor(n.body)}</div>
                        ${n.archived_at ? '' : `<input class="addline" data-id="${n.id}" type="text" placeholder="Add a line…" autocomplete="off">`}
                        <div class="card-foot">
                            <span class="when" title="${escapeHtml(n.created_at)}">${whenLabel(n.created_at)}</span>
                            ${n.source === 'mcp' ? '<span class="src" title="Sent through the MoveIt server">phone</span>' : ''}
                            <span class="saved" data-saved="${n.id}"></span>
                            <div class="card-acts">${acts}</div>
                        </div>
                    </div>`;
            }).join('');
            cards.querySelectorAll('textarea.note-text').forEach(grow);
        }

        // The field is as tall as its text, so a card reads like a card.
        function grow(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }

        // Links and pictures in the note, rendered under the text: a field
        // can't show them (the old read-only card did, inline).
        function linksFor(body) {
            const urls = [...new Set((body || '').match(URL_RE) || [])]
                .map(u => u.replace(/[.,)\]'"!?]+$/, ''));
            return urls.map(u => {
                const href = u.startsWith('www.') ? 'https://' + u : u;
                if (!/^https?:\/\//i.test(href)) return '';
                return IMG_RE.test(u)
                    ? `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer"><img src="${escapeHtml(href)}" alt=""></a>`
                    : `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${escapeHtml(u)}</a>`;
            }).join('');
        }

        // Saves as you type (a pause of a moment, or leaving the field). An
        // emptied note isn't saved — clearing the text is not how a note goes;
        // Archive and Delete are — and leaving it puts the text back.
        const saveTimers = new Map();
        function queueSave(id, delay = 700) {
            clearTimeout(saveTimers.get(id));
            saveTimers.set(id, setTimeout(() => saveNote(id), delay));
        }
        async function saveNote(id) {
            clearTimeout(saveTimers.get(id));
            const ta = document.querySelector(`textarea.note-text[data-id="${id}"]`);
            const note = notes.find(n => n.id === id);
            if (!ta || !note) return;
            const body = ta.value.replace(/\s+$/, '');
            if (!body.trim() || body === note.body) return;
            const mark = document.querySelector(`[data-saved="${id}"]`);
            try {
                const updated = await api(`/notes/${id}`, { method: 'PUT', body: { body } });
                Object.assign(note, updated);
                const links = ta.parentElement.querySelector('.note-links');
                if (links) links.innerHTML = linksFor(note.body);
                if (mark) { mark.textContent = 'saved'; setTimeout(() => { if (mark.textContent === 'saved') mark.textContent = ''; }, 1500); }
            } catch (err) { showToast('Error: ' + err.message); }
        }

        async function saveNew() {
            const input = document.getElementById('composer');
            const body = input.value.trim();
            if (!body) return;
            input.disabled = true;
            try {
                const note = await api(`${me}/notes`, { method: 'POST', body: { body } });
                notes.unshift(note);
                input.value = '';
                render();
                const line = document.querySelector(`input.addline[data-id="${note.id}"]`);
                if (line) { input.disabled = false; line.focus(); return; }
            } catch (err) { showToast('Error: ' + err.message); }
            input.disabled = false;
            input.focus();
        }

        document.getElementById('composer').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); saveNew(); }
        });
        document.getElementById('showArchived').addEventListener('change', load);

        const cardsEl = document.getElementById('cards');
        cardsEl.addEventListener('input', (e) => {
            if (!e.target.matches('textarea.note-text')) return;
            grow(e.target);
            queueSave(parseInt(e.target.dataset.id));
        });
        cardsEl.addEventListener('focusout', (e) => {
            if (!e.target.matches('textarea.note-text')) return;
            const id = parseInt(e.target.dataset.id);
            const note = notes.find(n => n.id === id);
            if (note && !e.target.value.trim()) { e.target.value = note.body; grow(e.target); return; }
            saveNote(id);
        });
        cardsEl.addEventListener('keydown', async (e) => {
            if (e.target.matches('textarea.note-text') && e.key === 'Escape') { e.target.blur(); return; }
            if (!e.target.matches('input.addline')) return;
            if (e.key === 'Escape') { e.target.value = ''; e.target.blur(); return; }
            if (e.key !== 'Enter' || e.isComposing) return;
            e.preventDefault();
            const line = e.target.value.trim();
            if (!line) return;
            const id = parseInt(e.target.dataset.id);
            const ta = cardsEl.querySelector(`textarea.note-text[data-id="${id}"]`);
            if (!ta) return;
            ta.value = ta.value.replace(/\s+$/, '') + '\n' + line;
            grow(ta);
            e.target.value = '';
            await saveNote(id);
        });

        document.getElementById('cards').addEventListener('click', async (e) => {
            const btn = e.target.closest('button[data-act]');
            if (!btn) return;
            const id = parseInt(btn.dataset.id);
            const note = notes.find(n => n.id === id);
            if (!note) return;
            const act = btn.dataset.act;
            try {
                await saveNote(id);   // a pending edit lands before the note moves
                if (act === 'archive' || act === 'unarchive') {
                    const updated = await api(`/notes/${id}`, { method: 'PUT', body: { archived: act === 'archive' } });
                    if (act === 'archive' && !document.getElementById('showArchived').checked) notes = notes.filter(n => n.id !== id);
                    else notes = notes.map(n => n.id === id ? updated : n);
                    render();
                    showToast(act === 'archive' ? 'Archived — "Show archived" brings it back' : 'Restored');
                } else if (act === 'delete') {
                    if (!confirm('Delete this note for good?')) return;
                    await api(`/notes/${id}`, { method: 'DELETE' });
                    notes = notes.filter(n => n.id !== id);
                    render();
                } else if (act === 'task') {
                    // Today, first board. The first line is the task; the
                    // whole note goes on the task page as background so
                    // nothing is lost when a long note becomes a short row.
                    const boards = await api(`${me}/projects`);
                    if (!boards.length) { showToast('You have no board yet'); return; }
                    const firstLine = note.body.split('\n').map(l => l.trim()).find(Boolean) || note.body;
                    const today = new Date().toLocaleDateString('en-CA');
                    const task = await api(`${me}/tasks`, { method: 'POST', body: {
                        description: firstLine.slice(0, 500), scheduled_date: today, project_id: boards[0].id
                    } });
                    if (note.body.trim() !== firstLine) {
                        try { await api(`/tasks/${task.id}/page`, { method: 'PUT', body: { background: note.body } }); } catch (e) { /* the row exists; background is a nicety */ }
                    }
                    const updated = await api(`/notes/${id}`, { method: 'PUT', body: { archived: true } });
                    if (!document.getElementById('showArchived').checked) notes = notes.filter(n => n.id !== id);
                    else notes = notes.map(n => n.id === id ? updated : n);
                    render();
                    showToast(`On ${boards[0].name} for today — the note is archived`);
                }
            } catch (err) { showToast('Error: ' + err.message); }
        });

        load().then(() => {
            // The visit is what clears the board icon's dot; the fresh edges
            // were computed from the previous value before this write.
            if (me) localStorage.setItem(SEEN_KEY, new Date().toISOString());
        }).catch(err => showToast('Error: ' + err.message));
    </script>
</body>
</html>
