<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferences · MoveIt</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="mask-icon" href="/favicon-mask.svg" color="#0ea5e9">
    <style>
        @font-face {
            font-family: 'Bricolage Grotesque';
            src: url('/fonts/bricolage-grotesque-800.woff2') format('woff2');
            font-weight: 800;
            font-display: swap;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            background: #f8fafc;
            color: #0f172a;
            padding: 20px;
        }
        .page { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
        .page-header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
        .wordmark {
            font-family: 'Bricolage Grotesque', -apple-system, sans-serif;
            font-weight: 800; font-size: 15px; color: #0f172a; text-decoration: none; letter-spacing: -0.02em;
        }
        .wordmark span { color: #0ea5e9; }
        .page-meta { font-size: 12px; color: #64748b; }
        .page-meta b { color: #475569; font-weight: 600; }
        .page-title { font-size: 17px; font-weight: 600; line-height: 1.35; }
        .page-lede { font-size: 12px; color: #64748b; line-height: 1.5; margin-top: -6px; }
        .pane { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; }
        .pane-title {
            font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
            color: #94a3b8; margin-bottom: 8px; display: flex; align-items: baseline; gap: 8px;
        }
        .save-state { margin-left: auto; font-weight: 400; text-transform: none; letter-spacing: 0; color: #cbd5e1; transition: color 0.2s; }
        .save-state.saved { color: #0ea5e9; }
        .save-state.error { color: #ef4444; }
        .pref { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; line-height: 1.6; }
        .pref input {
            font: inherit; width: 58px; padding: 3px 7px; text-align: center;
            border: 1px solid #e2e8f0; border-radius: 6px; background: #ffffff; color: inherit; outline: none;
        }
        .pref input:focus { border-color: #0ea5e9; }
        .pref-note { font-size: 12px; color: #64748b; line-height: 1.5; margin-top: 8px; }
        .pref-note b { color: #f59e0b; font-weight: 600; }
        .cal-line { font-size: 12px; color: #64748b; line-height: 1.5; margin: 2px 0; }
        .cal-line.error { color: #ef4444; }
        .cal-form { display: flex; gap: 8px; margin-top: 4px; }
        .cal-form input[type=text] {
            flex: 1; min-width: 0; width: auto; text-align: left; padding: 5px 8px; font: inherit;
            border: 1px solid #e2e8f0; border-radius: 6px; background: #ffffff; color: inherit; outline: none;
        }
        .cal-form input[type=text]:focus { border-color: #0ea5e9; }
        .cal-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .cal-btn {
            font: inherit; font-size: 12px; padding: 4px 12px; border-radius: 6px; cursor: pointer;
            border: 1px solid #e2e8f0; background: #ffffff; color: #0284c7;
        }
        .cal-btn:hover { border-color: #bae6fd; background: #f0f9ff; }
        .cal-btn.danger { color: #ef4444; margin-left: auto; }
        .beta-tag { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: #b45309; background: #fef3c7; border-radius: 4px; padding: 1px 5px; }
        .page-error { text-align: center; color: #64748b; padding: 48px 0; }

        body.dark { background: #0f172a; color: #e2e8f0; }
        body.dark .wordmark { color: #f1f5f9; }
        body.dark .page-meta, body.dark .page-lede, body.dark .pref-note { color: #94a3b8; }
        body.dark .page-meta b { color: #cbd5e1; }
        body.dark .pane { background: #1e293b; border-color: #334155; }
        body.dark .pref input { background: #0f172a; border-color: #334155; color: #e2e8f0; }
        body.dark .pref input:focus { border-color: #0ea5e9; }
        body.dark .cal-line { color: #94a3b8; }
        body.dark .cal-form input[type=text] { background: #0f172a; border-color: #334155; color: #e2e8f0; }
        body.dark .cal-btn { background: #1e293b; border-color: #334155; color: #38bdf8; }
        body.dark .cal-btn:hover { background: rgba(14, 165, 233, 0.12); }
        body.dark .cal-btn.danger { color: #f87171; }
        body.dark .beta-tag { background: #451a03; color: #fbbf24; }
        body.dark .save-state { color: #475569; }
        body.dark .save-state.saved { color: #38bdf8; }

        /* The completed-tasks switch is a Jelly UI web component (vendored,
           /vendor/jelly.js). The provider is display: contents, so it costs
           no layout; its mode is set from the app's own theme key below. */
        .pref.pref-switch { gap: 12px; }
        jelly-switch { flex-shrink: 0; }
    </style>
    <script type="module" src="/vendor/jelly.js"></script>
</head>
<body>
    <div class="page" id="page"><div class="page-error">Opening&hellip;</div></div>
    <script>
        if (localStorage.getItem('movealong.theme') === 'dark') document.body.classList.add('dark');
        const projectId = parseInt(location.pathname.split('/').pop(), 10);
        const sess = (() => { try { return JSON.parse(localStorage.getItem('movealong.session') || 'null'); } catch (e) { return null; } })();

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text == null ? '' : String(text);
            return div.innerHTML;
        }

        async function api(path, options = {}) {
            const res = await fetch('/api' + path, {
                method: options.method || 'GET',
                headers: { 'Content-Type': 'application/json' },
                body: options.body ? JSON.stringify(options.body) : undefined
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
            return data;
        }

        function render(data) {
            const dark = document.body.classList.contains('dark');
            document.title = `Preferences · ${data.project.name} · MoveIt`;
            document.getElementById('page').innerHTML = `
                <div class="page-header">
                    <a class="wordmark" href="/">Move<span>It</span></a>
                    <span class="page-meta"><b>${escapeHtml(data.project.name)}</b></span>
                </div>
                <div class="page-title">Preferences</div>
                <div class="page-lede">How this board behaves. Each board has its own.</div>

                <div class="pane">
                    <div class="pane-title">Lagging tasks
                        <span class="save-state" id="autolockState"></span>
                    </div>
                    <div class="pref">
                        <span>Lock a task to today once it has been on the board for</span>
                        <input type="number" id="autolockInput" min="1" max="365" inputmode="numeric" placeholder="off">
                        <span>days</span>
                    </div>
                    <div class="pref-note">Counts the same way as the little grey number after a task, so on the day that number reaches your threshold the task gets a <b>🔒</b> and stops moving forward — you deal with it today, or unlock it on purpose. Leave the field empty to turn this off. Tasks you have deliberately moved to a future day are left alone.</div>
                </div>

                <div class="pane">
                    <div class="pane-title">Completed tasks
                        <span class="save-state" id="showCompletedState"></span>
                    </div>
                    <jelly-theme mode="${dark ? 'dark' : 'light'}" accent="#0ea5e9">
                        <div class="pref pref-switch">
                            <jelly-switch id="showCompletedSwitch" size="small" label="Show completed tasks on the board"${data.show_completed ? ' checked' : ''}></jelly-switch>
                            <input type="checkbox" id="showCompletedFallback" hidden${data.show_completed ? ' checked' : ''}>
                            <span>Show completed tasks on the board</span>
                        </div>
                    </jelly-theme>
                    <div class="pref-note">Off, a task leaves the day card the moment you tick it, and the board only ever shows what is still to do. Everything you have finished is on the <b>Completed tasks</b> board — open it from this board's tab — with a chart of the last thirty days. On, finished tasks stay struck through under a divider on their day, the way they used to.</div>
                </div>

                <div class="pane" id="wherePane"${sess && sess.slug ? '' : ' hidden'}>
                    <div class="pane-title">Where you are
                        <span class="save-state" id="whereState"></span>
                    </div>
                    <div class="pref">
                        <span>Weather for</span>
                        <span id="zipPlace" style="color:#64748b;font-size:12px">wherever this device is</span>
                    </div>
                    <div class="pref-note">This is about <b>you</b>, not this board — it follows you to every board. There's nothing to set: the weather follows this device's location (the board asks the browser each time it opens), and the time zone follows your Mac's.</div>
                </div>

                <div class="pane" id="calPane"${sess && sess.slug ? '' : ' hidden'}>
                    <div class="pane-title"><span>Calendar <span class="beta-tag">Beta</span></span>
                        <span class="save-state" id="calState"></span>
                    </div>
                    <div id="calBody"><div class="cal-line">Loading&hellip;</div></div>
                    <div class="pref-note">This is about <b>you</b>, not this board — imported events show on every board. Events reach the board two ways: a secret iCal address pasted here (checked every 15 minutes), and Claude through your Google Calendar connector, which Tom refreshes on his heartbeat.</div>
                </div>`;

            // ---- Where you are (user-level, autosave) ----
            if (sess && sess.slug) {
                const placeEl = document.getElementById('zipPlace');
                const base = `/companies/${encodeURIComponent(sess.subdomain)}/users/${encodeURIComponent(sess.slug)}/settings`;
                api(base).then(st => { if (st.place) placeEl.textContent = st.place + ' (last seen)'; }).catch(() => {});
            }

            // ---- Calendar (user-level; moved here from the board's header, 2026-10-02) ----
            if (sess && sess.slug) {
                const base = `/companies/${encodeURIComponent(sess.subdomain)}/users/${encodeURIComponent(sess.slug)}/calendar`;
                const body = document.getElementById('calBody');
                const calState = document.getElementById('calState');
                let cal = { connected: false, enabled: false };
                const since = (iso) => {
                    if (!iso) return 'never';
                    const mins = Math.floor((Date.now() - Date.parse(iso)) / 60000);
                    if (!isFinite(mins) || mins < 1) return 'just now';
                    if (mins < 60) return `${mins} min ago`;
                    const hrs = Math.floor(mins / 60);
                    return hrs < 24 ? `${hrs} hr ago` : `${Math.floor(hrs / 24)} d ago`;
                };
                const drawCal = () => {
                    const via = cal.connector_count
                        ? `<div class="cal-line">${cal.connector_count} events from your Claude (Google Calendar connector) · posted ${since(cal.connector_posted_at)}. Say “put my calendar on the board” to refresh them.</div>` : '';
                    if (!cal.connected) {
                        body.innerHTML = `${via}
                            <div class="cal-line">Not connected. Google, Proton, iCloud and Outlook each publish a private iCal address in their calendar settings.</div>
                            <div class="cal-form"><input type="text" id="calUrl" placeholder="Paste your secret iCal URL" autocomplete="off" spellcheck="false"><button class="cal-btn" data-act="connect">Connect</button></div>
                            <div class="cal-line" style="color:#b45309">Anyone who can open your board will see these event titles — this app has no password.</div>`;
                    } else {
                        const err = cal.last_status === 'error' ? `<div class="cal-line error">Last sync failed: ${escapeHtml(cal.last_error || 'unknown error')}</div>` : '';
                        body.innerHTML = `<div class="cal-line">${escapeHtml(cal.url_masked || '')} · <b>${cal.enabled ? 'on' : 'off'}</b><br>${cal.event_count || 0} events · synced ${since(cal.last_synced_at)}</div>
                            ${err}${via}
                            <div class="cal-actions">
                                <button class="cal-btn" data-act="sync">Sync now</button>
                                <button class="cal-btn" data-act="toggle">${cal.enabled ? 'Turn off' : 'Turn on'}</button>
                                <button class="cal-btn danger" data-act="disconnect">Disconnect</button>
                            </div>`;
                    }
                };
                const say = (t, bad) => { calState.textContent = t; calState.className = 'save-state ' + (bad ? 'error' : 'saved'); };
                const loadCal = () => api(base).then(c => { cal = c; drawCal(); }).catch(() => { cal = { connected: false, enabled: false }; drawCal(); });
                body.addEventListener('click', async (e) => {
                    const btn = e.target.closest('[data-act]');
                    if (!btn) return;
                    const act = btn.dataset.act;
                    try {
                        if (act === 'connect') {
                            const url = (document.getElementById('calUrl') || {}).value || '';
                            if (!url.trim()) { say('Paste your calendar URL first', true); return; }
                            say('Connecting…');
                            cal = await api(base, { method: 'PUT', body: { url: url.trim() } });
                            say(`connected — ${cal.event_count || 0} events`);
                        } else if (act === 'sync') {
                            say('Syncing…');
                            cal = await api(base + '/sync', { method: 'POST' });
                            say(`synced — ${cal.event_count || 0} events`);
                        } else if (act === 'toggle') {
                            cal = await api(base, { method: 'PUT', body: { enabled: !cal.enabled } });
                            say(cal.enabled ? 'on' : 'off');
                        } else if (act === 'disconnect') {
                            if (!confirm('Disconnect your calendar? Imported events will be removed from the board.')) return;
                            cal = await api(base, { method: 'DELETE' });
                            say('disconnected');
                        }
                        drawCal();
                    } catch (err) {
                        say(err.message || 'Calendar action failed', true);
                        loadCal();
                    }
                });
                body.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'calUrl') { e.preventDefault(); body.querySelector('[data-act=connect]').click(); } });
                loadCal();
            }

            const input = document.getElementById('autolockInput');
            const state = document.getElementById('autolockState');
            input.value = data.autolock_days || '';
            let timer;
            const save = async () => {
                const v = input.value.trim();
                try {
                    const r = await api(`/projects/${projectId}/preferences`, { method: 'PUT', body: { autolock_days: v === '' ? null : v } });
                    input.value = r.autolock_days || '';
                    state.textContent = r.autolock_days ? 'saved' : 'off';
                    state.className = 'save-state saved';
                } catch (err) {
                    state.textContent = err.message;
                    state.className = 'save-state error';
                }
            };
            input.addEventListener('input', () => {
                state.textContent = 'typing…';
                state.className = 'save-state';
                clearTimeout(timer);
                timer = setTimeout(save, 800);
            });
            input.addEventListener('blur', () => { clearTimeout(timer); save(); });
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { clearTimeout(timer); save(); } });

            // The switch reflects `checked` on tap, drag and keyboard; one
            // PUT per change, and the server's answer is what the switch
            // shows afterwards, so a rejected write can't leave it lying.
            const sw = document.getElementById('showCompletedSwitch');
            const swState = document.getElementById('showCompletedState');
            let lastSaved = !!data.show_completed;
            const saveSwitch = async () => {
                try {
                    const r = await api(`/projects/${projectId}/preferences`, { method: 'PUT', body: { show_completed: !!sw.checked } });
                    sw.checked = !!r.show_completed;
                    lastSaved = !!r.show_completed;
                    swState.textContent = r.show_completed ? 'shown on the board' : 'saved';
                    swState.className = 'save-state saved';
                } catch (err) {
                    swState.textContent = err.message;
                    swState.className = 'save-state error';
                }
            };
            // The native checkbox lives in the component's shadow root, and
            // a native `change` does not cross that boundary in every
            // browser — so listen wide and dedupe on the reflected state.
            const onFlip = () => setTimeout(() => {
                if (!!sw.checked === lastSaved) return;
                lastSaved = !!sw.checked;
                saveSwitch();
            }, 0);
            ['change', 'input', 'click', 'keyup'].forEach(ev => sw.addEventListener(ev, onFlip));

            // If the vendored module never registers the element (blocked,
            // failed to load, an old browser), a bare <jelly-switch> renders
            // as nothing — so a native checkbox stands in after two seconds.
            const fallback = document.getElementById('showCompletedFallback');
            Promise.race([
                customElements.whenDefined('jelly-switch').then(() => true),
                new Promise(r => setTimeout(() => r(false), 2000))
            ]).then(defined => {
                if (defined) return;
                sw.hidden = true;
                fallback.hidden = false;
                fallback.addEventListener('change', () => {
                    sw.checked = fallback.checked;
                    lastSaved = fallback.checked;
                    saveSwitch();
                });
            });
        }

        (async () => {
            if (!Number.isFinite(projectId)) {
                document.getElementById('page').innerHTML = '<div class="page-error">That is not a board link.</div>';
                return;
            }
            try {
                render(await api(`/projects/${projectId}/preferences`));
            } catch (err) {
                document.getElementById('page').innerHTML = `<div class="page-error">${escapeHtml('Could not open preferences: ' + err.message)}</div>`;
            }
        })();
    </script>
</body>
</html>
