<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Move Along</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 40px;
            font-size: 13px;
            line-height: 1.5;
        }

        h1 {
            margin-bottom: 20px;
            font-weight: 300;
            color: #94a3b8;
        }

        .board-container {
            display: flex;
            gap: 16px;
            padding-bottom: 20px;
            align-items: flex-start;
            width: 100%;
            position: relative;
            overflow-x: auto;
        }

        .board-container.has-expanded {
            padding-bottom: 440px;
        }

        .day-column {
            display: flex;
            flex-direction: column;
            flex: 0 0 200px;
            width: 200px;
            position: relative;
        }

        .day-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            width: 200px;
            min-height: 200px;
            box-sizing: border-box;
            overflow: visible;
            border: 1px solid #e2e8f0;
        }

        .day-header-row {
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .day-header {
            font-size: 14px;
            font-weight: 600;
            color: #0f172a;
        }

        .day-date {
            font-size: 11px;
            color: #64748b;
        }

        .day-card.today .day-header {
            color: #0ea5e9;
            font-weight: 700;
        }

        .day-card.today .day-date {
            color: #0ea5e9;
            font-weight: 600;
        }

        /* Overdue days: a locked past-due task pulls the row back before today.
           Red border flags those days so the first pane reads as "not today". */
        .day-card.overdue,
        .day-card.overdue.selected {
            border: 2px solid #ef4444;
        }

        .day-card.overdue .day-header,
        .day-card.overdue .day-date {
            color: #ef4444;
        }

        .day-card.selected {
            border: 2px solid #0ea5e9;
            box-shadow: 0 4px 16px rgba(14, 165, 233, 0.18);
        }

        .day-card:not(.selected) {
            cursor: pointer;
        }

        .day-card:not(.selected):hover {
            border-color: #cbd5e1;
        }

        .task-input-container {
            margin-bottom: 6px;
        }

        .task-input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: #ffffff;
            color: #0f172a;
            font-size: 12px;
        }

        .task-input:focus {
            outline: none;
            border-color: #38bdf8;
            background: #fff;
        }

        .task-input::placeholder {
            color: #94a3b8;
        }

        .tasks-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .pending-tasks {
            flex: 1;
            min-height: 50px;
        }

        .task-divider {
            border: none;
            border-top: 1px dashed #cbd5e1;
            margin: 12px 0;
        }

        .completed-tasks {
            opacity: 0.6;
        }

        .assigned-tasks {
            opacity: 0.5;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 0;
            border-radius: 4px;
            transition: background 0.2s;
            user-select: none;
        }

        /* Visible hover (the old rgba(255,255,255,.05) was white-on-white).
           Chain-hover tints set inline styles, which still win over this. */
        .task-item:hover {
            background: #f0f9ff;
        }

        /* One-time contextual whisper teaching drag-to-chain; dismissible,
           placeholder-grade on purpose. */
        .hint-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding: 5px 8px;
            border: 1px dashed #bae6fd;
            border-radius: 6px;
            background: #f8fcff;
            font-size: 11px;
            color: #64748b;
            line-height: 1.35;
        }

        .hint-chip .hint-dismiss {
            color: #cbd5e1;
            cursor: pointer;
            font-size: 12px;
            margin-left: auto;
            padding: 0 2px;
        }

        .hint-chip .hint-dismiss:hover {
            color: #64748b;
        }

        .task-item.placeholder {
            opacity: 0.6;
            pointer-events: none;
        }

        .task-item.placeholder .task-circle,
        .task-item.placeholder .task-arrow {
            opacity: 0.5;
        }

        .task-circle {
            width: 14px;
            height: 14px;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            /* Series countdown number (empty for free-standing tasks) */
            font-size: 8px;
            font-weight: 700;
            color: #475569;
            line-height: 1;
        }

        .task-circle:hover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
        }

        .task-item.completed .task-circle {
            background: #38bdf8;
            border-color: #38bdf8;
        }

        .task-item.completed .task-circle::after {
            content: '\2713';
            color: white;
            font-size: 11px;
        }

        .task-item.completed .task-description {
            text-decoration: line-through;
            color: #94a3b8;
        }

        /* Assigned (forwarded) task styling */
        .task-item.forwarded .task-circle {
            background: #f59e0b;
            border-color: #f59e0b;
        }

        .task-item.forwarded .task-circle::after {
            content: '\2794';
            color: white;
            font-size: 10px;
        }

        .task-item.forwarded .task-description {
            color: #94a3b8;
        }

        .assigned-from {
            color: #94a3b8;
            font-size: 11px;
            font-style: italic;
        }

        .assigned-to-label {
            color: #f59e0b;
            font-size: 11px;
            font-style: italic;
        }

        .task-return {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #64748b;
            font-size: 13px;
            border-radius: 3px;
            transition: all 0.2s;
            flex-shrink: 0;
            margin-left: auto;
        }

        .task-return:hover {
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
        }

        /* User Switcher */
        .user-switcher {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            width: fit-content;
        }

        .user-switcher-label {
            color: #64748b;
            font-size: 12px;
        }

        .user-switcher-buttons {
            display: flex;
            gap: 8px;
        }

        .user-switch-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid transparent;
            background: transparent;
            transition: all 0.2s;
        }

        .user-switch-btn:hover {
            background: #f1f5f9;
        }

        .user-switch-btn.active {
            background: #f0f9ff;
            border-color: #38bdf8;
        }

        .user-switch-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: white;
        }

        .user-switch-name {
            font-size: 12px;
            color: #475569;
        }

        .user-switch-btn.active .user-switch-name {
            color: #0284c7;
        }

        /* Wordmark face — the only non-system type in the app (self-hosted,
           single 800 weight, ~38 KB). Used once, on the logo. */
        @font-face {
            font-family: 'Bricolage Grotesque';
            font-style: normal;
            font-weight: 800;
            font-display: swap;
            src: url('/fonts/bricolage-grotesque-800.woff2') format('woff2');
        }

        /* Inline Header / Signup — one quiet 44px row; nothing in the chrome
           outranks a day header, so the board owns the screen. */
        .app-header {
            display: flex;
            align-items: center;
            gap: 14px;
            min-height: 44px;
            margin: -20px -20px 16px;
            padding: 4px 20px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid #e8edf3;
            flex-wrap: wrap;
        }

        .app-logo {
            font-family: 'Bricolage Grotesque', -apple-system, sans-serif;
            font-weight: 800;
            font-size: 17px;
            letter-spacing: -0.03em;
            color: #0f172a;
            white-space: nowrap;
        }

        .app-logo .accent {
            color: #0ea5e9;
        }

        .header-form {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header-form.hidden {
            display: none;
        }

        .header-input {
            padding: 8px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: #ffffff;
            color: #0f172a;
            font-size: 13px;
            width: 160px;
        }

        .header-input:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .header-input::placeholder {
            color: #94a3b8;
        }

        .header-input.auto-generated {
            color: #0f172a;
            opacity: 0.6;
        }

        .header-input.auto-generated.user-edited {
            color: #0f172a;
            opacity: 1;
        }

        .btn-go {
            padding: 8px 20px;
            border-radius: 6px;
            border: none;
            font-size: 13px;
            cursor: pointer;
            background: #0ea5e9;
            color: #fff;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-go:hover:not(:disabled) {
            background: #0284c7;
        }

        .btn-go:disabled {
            background: #cbd5e1;
            color: #fff;
            opacity: 0.7;
            cursor: not-allowed;
        }

        .header-display {
            display: none;
            align-items: center;
            gap: 16px;
        }

        .header-display.visible {
            display: flex;
        }

        .header-label {
            font-size: 12px;
            color: #64748b;
        }

        .header-value {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 500;
        }

        .header-separator {
            color: #cbd5e1;
        }

        .header-spacer {
            flex: 1;
        }

        .task-arrow {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #64748b;
            font-size: 13px;
            border-radius: 3px;
            transition: all 0.2s;
            flex-shrink: 0;
            user-select: none;
        }

        .task-arrow:hover {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
        }

        .task-description {
            flex: 1;
            font-size: 13px;
            line-height: 1.4;
            color: #0f172a;
            cursor: pointer;
            overflow-wrap: anywhere;
        }

        /* URLs inside a task description open in a new tab (never toggle the pane) */
        .task-link {
            color: #0284c7;
            text-decoration: underline;
            text-decoration-color: rgba(2, 132, 199, 0.4);
            text-underline-offset: 2px;
            cursor: pointer;
        }

        .task-link:hover {
            color: #0ea5e9;
            text-decoration-color: #0ea5e9;
        }

        .task-item.completed .task-link {
            color: #94a3b8;
        }

        /* Days-pushed counter: inclusive day count since the task's origin day */
        .task-day-counter {
            font-size: 10px;
            color: #94a3b8;
            margin-left: 3px;
        }

        .task-day-counter.lagging {
            color: #ef4444;
        }

        /* Priority: 1-3 red exclamation marks, set by hovering a task and
           pressing 1/2/3. Tracking is pulled in slightly to keep three marks
           narrow, but not so far that 1 / 2 / 3 are hard to tell apart at a
           glance — three marks cost ~12px, so the 200px column never widens. */
        .task-priority {
            font-size: 11px;
            font-weight: 700;
            color: #ef4444;
            letter-spacing: -0.3px;
            margin-left: 3px;
            padding-right: 1px;
            white-space: nowrap;
        }

        .task-regenerate {
            flex-shrink: 0;
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: none;
            background: transparent;
            color: #64748b;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .task-regenerate:hover {
            color: #0ea5e9;
            background: rgba(14, 165, 233, 0.12);
        }

        .task-description:hover {
            color: #0ea5e9;
        }

        .task-lock {
            flex-shrink: 0;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 11px;
            line-height: 1;
            border-radius: 4px;
            opacity: 0.35;
            transition: all 0.15s;
            user-select: none;
        }

        .task-lock:hover {
            opacity: 1;
            background: rgba(245, 158, 11, 0.15);
        }

        .task-lock.locked {
            opacity: 1;
        }

        .task-unlink {
            flex-shrink: 0;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 11px;
            line-height: 1;
            border-radius: 4px;
            opacity: 0;
            transition: all 0.15s;
            user-select: none;
        }

        .task-item:hover .task-unlink {
            opacity: 0.35;
        }

        .task-unlink:hover {
            opacity: 1 !important;
            background: rgba(239, 68, 68, 0.15);
        }

        /* Locked tasks get a deadline accent */
        .task-item.locked {
            border-left: 2px solid #f59e0b;
            padding-left: 4px;
            margin-left: -6px;
        }

        /* Locked task whose deadline is today: the day has arrived. */
        .task-item.locked-today .task-description {
            color: #ef4444;
        }

        /* Series: drag a task onto another to chain them. */
        .task-item.drop-target {
            outline: 2px dashed #38bdf8;
            outline-offset: -2px;
        }

        /* Series hover-thread: hovered chain lights up, the rest fades. */
        .board-container.threading .task-item:not(.chain-active) {
            opacity: 0.3;
        }

        #chainOverlay {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: visible;
            z-index: 15;
        }

        /* Lock Popup (reuses .team-popup box) */
        .lock-popup-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 190px;
        }

        .lock-popup-menu .lock-opt {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: #0f172a;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }

        .lock-popup-menu .lock-opt:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .lock-popup-menu .lock-opt.danger {
            color: #b45309;
        }

        .lock-popup-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .lock-popup-row input[type="date"] {
            flex: 1;
            padding: 6px 8px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 13px;
            color: #0f172a;
        }

        .lock-popup-row button {
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            background: #f59e0b;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .lock-popup-row button:hover {
            background: #d97706;
        }

        .lock-popup-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #64748b;
            margin: 2px 0;
        }

        /* Team Popup */
        .team-popup {
            position: absolute;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(15, 23, 42, 0.15);
            display: none;
            user-select: none;
        }

        .team-popup.visible {
            display: block;
        }

        .team-member {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
        }

        .team-member:hover {
            background: #f1f5f9;
        }

        .team-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .team-name {
            font-size: 12px;
            color: #475569;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 40px;
            right: 20px;
            background: #0f172a;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.25);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 3000;
        }

        .toast.visible {
            transform: translateY(0);
            opacity: 1;
        }

        /* Hide horizontal scrollbar (scrolling still works via trackpad/wheel) */
        .board-container {
            scrollbar-width: none;
        }
        .board-container::-webkit-scrollbar {
            display: none;
        }

        .instructions {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 6px 32px 6px 16px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid #e8edf3;
            font-size: 11px;
            color: #94a3b8;
            z-index: 100;
        }

        /* Brand-blue badge — same accent as the wordmark's "Along" */
        .help-link {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: none;
            background: #0ea5e9;
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.15s;
        }

        .help-link:hover {
            background: #0284c7;
            box-shadow: 0 1px 4px rgba(14, 165, 233, 0.4);
        }

        .instructions ul {
            list-style: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
            max-width: 100%;
        }

        .instructions ul::-webkit-scrollbar { display: none; }

        .instructions li {
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 8px;
            border-radius: 6px;
            transition: background 0.15s;
        }

        .instructions li:hover {
            background: #f1f5f9;
        }

        .instructions code {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            padding: 1px 5px;
            border-radius: 4px;
            background: #eef2f7;
            border: 1px solid #e2e8f0;
            color: #475569;
            font-size: 10px;
            line-height: 1.5;
        }

        /* Form elements (used in modal) */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #64748b;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #ffffff;
            color: #0f172a;
            font-size: 13px;
        }

        .form-input:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .form-input::placeholder {
            color: #94a3b8;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #0ea5e9;
            color: #ffffff;
            font-weight: 500;
        }

        .btn-primary:hover {
            background: #0284c7;
        }

        .btn-primary:disabled {
            background: #cbd5e1;
            color: #ffffff;
            cursor: not-allowed;
        }

        /* App container */
        .app-container {
            display: block;
        }

        /* Add new user modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
        }

        .modal-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            transform: scale(0.95);
            transition: transform 0.2s;
            box-shadow: 0 10px 40px rgba(15, 23, 42, 0.18);
        }

        .modal-overlay.visible .modal {
            transform: scale(1);
        }

        .modal h3 {
            margin-bottom: 20px;
            font-weight: 500;
            color: #0f172a;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #e2e8f0;
            color: #475569;
            flex: 1;
        }

        .btn-secondary:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .btn-small {
            padding: 10px 16px;
            font-size: 12px;
            flex: 1;
        }

        /* Copy link display */
        .link-display {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            margin-top: 16px;
        }

        .link-display-label {
            font-size: 11px;
            color: #64748b;
            margin-bottom: 8px;
        }

        .link-display-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .link-display-url {
            flex: 1;
            font-family: monospace;
            font-size: 12px;
            color: #0ea5e9;
            word-break: break-all;
        }

        .btn-copy {
            padding: 6px 12px;
            font-size: 12px;
            background: #e2e8f0;
            border: none;
            color: #0f172a;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-copy:hover {
            background: #cbd5e1;
        }

        .btn-copy.copied {
            background: #38bdf8;
            color: #ffffff;
        }

        /* Updated team popup with + button */
        .team-popup-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            max-width: 280px;
        }

        .add-new-member {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            border: 2px dashed #cbd5e1;
            min-width: 56px;
        }

        .add-new-member:hover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.08);
        }

        .add-new-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #64748b;
            margin-bottom: 4px;
        }

        .add-new-member:hover .add-new-icon {
            background: #bae6fd;
            color: #0ea5e9;
        }

        .add-new-label {
            font-size: 11px;
            color: #64748b;
        }

        /* ============================================
           PROJECT BAR
           ============================================ */
        .project-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding: 8px 12px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow-x: auto;
        }

        /* Every tab shares one geometry — selecting a board must not resize
           its tab, or the whole row would shift sideways on every switch.
           Active differs by colour and weight only. */
        .project-tab {
            position: relative;
            padding: 3px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            color: #475569;
            user-select: none;
        }

        .project-tab:hover {
            border-color: #38bdf8;
            color: #0284c7;
            background: #f0f9ff;
        }

        /* Colour only — no weight change. Bolding the active label would
           widen that tab and nudge every tab after it on each switch, which
           is exactly the movement this layout is meant to eliminate. */
        .project-tab.active {
            background: #f0f9ff;
            border-color: #38bdf8;
            color: #0284c7;
        }

        #projectTabs {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* An off-screen board has a deadline due (or overdue) — red, the
           sanctioned warning colour, same as overdue day panes. */
        .project-tab.due,
        .project-tab.due:hover {
            border: 2px solid #ef4444;
            padding: 2px 9px;
        }

        /* Drag to reorder: the row is the user's own arrangement. */
        .project-tab.dragging {
            opacity: 0.4;
        }

        .project-tab.drop-before::before,
        .project-tab.drop-after::after {
            content: '';
            position: absolute;
            top: -2px;
            bottom: -2px;
            width: 2px;
            border-radius: 1px;
            background: #0ea5e9;
        }

        .project-tab.drop-before::before { left: -5px; }
        .project-tab.drop-after::after { right: -5px; }

        /* Brand-colored like the wordmark — reads as app chrome, not board content */
        .project-add-btn {
            padding: 4px 10px;
            height: 26px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: #0f172a;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: -0.01em;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .project-add-btn .accent { color: #0ea5e9; }

        .project-add-btn:hover {
            color: #0284c7;
            background: #f0f9ff;
        }

        /* View toggle */
        .view-toggle {
            display: flex;
            background: #f1f5f9;
            border-radius: 6px;
            padding: 2px;
            margin-left: auto;
        }

        .view-toggle-btn {
            padding: 3px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            color: #64748b;
            background: transparent;
            border: none;
            transition: all 0.2s;
        }

        .view-toggle-btn:hover {
            color: #0f172a;
        }

        .view-toggle-btn.active {
            background: #ffffff;
            color: #0284c7;
            font-weight: 600;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
        }

        /* AI assistant master switch */
        .assistant-switch {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #64748b;
            user-select: none;
        }

        .assistant-label {
            white-space: nowrap;
        }

        .assistant-toggle {
            position: relative;
            width: 30px;
            height: 16px;
            padding: 0;
            border: none;
            border-radius: 999px;
            background: #cbd5e1;
            cursor: pointer;
            flex: 0 0 auto;
            transition: background 0.2s;
        }

        .assistant-toggle::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.2s;
        }

        .assistant-toggle.on {
            background: #0284c7;
        }

        .assistant-toggle.on::after {
            transform: translateX(14px);
        }

        /* ============================================
           SUBTASK PANE
           ============================================ */
        .subtask-pane {
            position: relative;
            background: #ffffff;
            border: 1px solid #e8edf3;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.10), 0 2px 6px rgba(15, 23, 42, 0.04);
            box-sizing: border-box;
            animation: slideDown 0.18s ease-out;
            min-width: 0;
            color: #0f172a;
        }

        /* Never wider than the day it hangs from. */
        .subtask-pane.board-pane {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            width: 100%;
            z-index: 5;
        }

        .subtask-pane.board-pane.anchor-right {
            left: 0;
            right: auto;
        }

        .subtask-pane-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            /* keep the title clear of the absolute ↺ in the corner */
            padding-right: 24px;
        }

        .subtask-pane-title {
            font-size: 13px;
            font-weight: 600;
            color: #0ea5e9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .subtask-list {
            display: flex;
            flex-direction: column;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .subtask-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .subtask-header-label {
            font-size: 14px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 600;
        }

        .subtask-regenerate {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 22px;
            height: 22px;
            border: none;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            font-size: 14px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .subtask-regenerate:hover {
            color: #0ea5e9;
            background: rgba(14, 165, 233, 0.12);
        }

        .subtask-item {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            padding: 6px 2px;
            font-size: 12px;
            color: #0f172a;
            border-bottom: 1px solid #f1f5f9;
        }

        .subtask-list .subtask-item:last-child {
            border-bottom: none;
        }

        .subtask-item.dependent {
            margin-left: 14px;
            color: #64748b;
        }

        .subtask-item.assigned-subtask {
            opacity: 0.5;
        }

        .subtask-check {
            width: 14px;
            height: 14px;
            margin-top: 1px;
            border: 1.5px solid #cbd5e1;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 10px;
            transition: all 0.2s;
        }

        .subtask-check:hover {
            border-color: #38bdf8;
        }

        .subtask-check.checked {
            background: #38bdf8;
            border-color: #38bdf8;
            color: white;
        }

        .subtask-emoji {
            cursor: pointer;
            font-size: 14px;
            line-height: 1.3;
            flex-shrink: 0;
            padding: 1px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .subtask-emoji:hover {
            background: #f1f5f9;
        }

        .subtask-emoji.assigned {
            cursor: default;
        }

        .subtask-desc {
            flex: 1;
            min-width: 0;
            font-size: 12px;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .subtask-desc.completed-subtask {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .subtask-assigned-label {
            font-size: 11px;
            color: #f59e0b;
            font-style: italic;
        }

        .subtask-input {
            width: 100%;
            box-sizing: border-box;
            padding: 6px 9px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: #ffffff;
            color: #0f172a;
            font-size: 12px;
            margin-top: 8px;
        }

        .subtask-input:focus {
            outline: none;
            border-color: #38bdf8;
            background: #fff;
        }

        .subtask-input::placeholder {
            color: #94a3b8;
        }

        /* Send-to-agent arrow on AI subtask rows */
        .subtask-send {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: none;
            background: #f0f9ff;
            color: #0ea5e9;
            font-size: 13px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .subtask-send:hover {
            background: #0ea5e9;
            color: #fff;
            transform: translateX(2px);
        }

        .subtask-send.subtask-up:hover {
            transform: translateY(-2px);
        }

        /* ===== Quick list ("list ..." tasks) ===== */
        .quick-list-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #64748b;
            font-weight: 600;
            margin: 8px 0 4px;
        }

        .quick-slot {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 2px;
        }

        .quick-slot .subtask-check {
            border-style: dashed;
            cursor: default;
        }

        .quick-slot-input {
            flex: 1;
            min-width: 0;
            border: none;
            border-bottom: 1px dashed #e2e8f0;
            background: transparent;
            font-size: 12px;
            color: #0f172a;
            padding: 2px 0;
        }

        .quick-slot-input:focus {
            outline: none;
            border-bottom-color: #38bdf8;
        }

        .quick-slot-input::placeholder {
            color: #cbd5e1;
        }

        .subtask-loading {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            color: #64748b;
            font-size: 12px;
        }

        .dot-pulse {
            display: inline-flex;
            gap: 4px;
        }

        .dot-pulse span {
            width: 4px;
            height: 4px;
            background: #94a3b8;
            border-radius: 50%;
            animation: dotPulse 1.2s ease-in-out infinite;
        }

        .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
        .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotPulse {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.2); }
        }

        /* ============================================
           MASTER PROJECT PAGE
           ============================================ */
        .master-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 800px;
        }

        .project-section {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
        }

        .project-section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .project-section-name {
            font-size: 15px;
            font-weight: 600;
            color: #0f172a;
        }

        .project-section-count {
            font-size: 11px;
            color: #64748b;
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .project-task-list {
            display: flex;
            flex-direction: column;
        }

        .project-task-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .project-task-item:last-child {
            border-bottom: none;
        }

        /* Row-level hover so the "what am I about to prioritize" cue covers the
           whole row, not just the description text. */
        .project-task-item:hover {
            background: #f8fafc;
        }

        .project-task-desc {
            flex: 1;
            font-size: 13px;
            cursor: pointer;
        }

        .project-task-desc:hover {
            color: #0ea5e9;
        }

        .project-task-date {
            font-size: 11px;
            color: #64748b;
        }

        /* Locked tasks show their deadline in red on the List view */
        .project-task-date.locked-date {
            color: #ef4444;
            font-weight: 600;
        }

        .subtask-progress {
            font-size: 11px;
            color: #64748b;
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .project-task-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #ffffff;
            color: #0f172a;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .project-task-input:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .project-task-input::placeholder {
            color: #94a3b8;
        }

        .empty-project {
            color: #94a3b8;
            font-size: 13px;
            padding: 8px 0;
            font-style: italic;
        }
        /* ============================================
           THEME TOGGLE + DARK MODE
           One override block, slate palette. Accent blue, semantic red,
           and lock amber all survive dark unchanged.
           ============================================ */
        .theme-toggle {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            line-height: 1;
        }

        .theme-toggle:hover {
            background: #f0f9ff;
            color: #0ea5e9;
        }

        body.dark {
            background: #0f172a;
            color: #e2e8f0;
        }

        /* Header chrome */
        body.dark .app-header {
            background: rgba(15, 23, 42, 0.85);
            border-bottom-color: #1e293b;
        }
        body.dark .app-logo { color: #f1f5f9; }
        body.dark .header-input,
        body.dark .task-input,
        body.dark .subtask-input,
        body.dark .project-task-input,
        body.dark .form-input {
            background: #1e293b;
            border-color: #334155;
            color: #e2e8f0;
        }
        body.dark .view-toggle { background: #1e293b; }
        body.dark .view-toggle-btn { color: #94a3b8; }
        body.dark .view-toggle-btn:hover { color: #e2e8f0; }
        body.dark .view-toggle-btn.active {
            background: #334155;
            color: #38bdf8;
        }
        body.dark .project-tab {
            background: #1e293b;
            border-color: #334155;
            color: #94a3b8;
        }
        /* Must out-specify `body.dark .project-tab` (0,2,1), which would
           otherwise reset border-color and leave the deadline flag visible
           only on hover. */
        body.dark .project-tab.due,
        body.dark .project-tab.due:hover {
            border-color: #ef4444;
        }
        body.dark .project-tab.active {
            background: rgba(14, 165, 233, 0.15);
            border-color: rgba(14, 165, 233, 0.35);
        }
        body.dark .project-add-btn { color: #f1f5f9; }
        body.dark .project-tab:hover,
        body.dark .project-add-btn:hover,
        body.dark .theme-toggle:hover {
            background: rgba(14, 165, 233, 0.12);
        }
        body.dark .header-sep { background: #334155; }

        /* Board */
        body.dark .day-card {
            background: #1e293b;
            border-color: #334155;
        }
        body.dark .day-card:not(.selected):hover { border-color: #475569; }
        body.dark .day-header { color: #f1f5f9; }
        body.dark .day-card.today .day-header,
        body.dark .day-card.today .day-date { color: #38bdf8; }
        body.dark .task-description { color: #e2e8f0; }
        body.dark .task-item:hover { background: rgba(14, 165, 233, 0.12); }
        body.dark .task-circle { border-color: #475569; color: #cbd5e1; }
        body.dark .task-divider { border-top-color: #334155; }
        body.dark .task-item.completed .task-description { color: #64748b; }
        body.dark .hint-chip {
            background: rgba(14, 165, 233, 0.08);
            border-color: rgba(14, 165, 233, 0.3);
            color: #94a3b8;
        }
        body.dark .task-link { color: #38bdf8; }

        /* Subtask pane */
        body.dark .subtask-pane {
            background: #1e293b;
            border-color: #334155;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
            color: #e2e8f0;
        }
        body.dark .subtask-item {
            color: #e2e8f0;
            border-bottom-color: #334155;
        }
        body.dark .subtask-item.dependent { color: #94a3b8; }
        body.dark .subtask-loading { color: #94a3b8; }
        body.dark .quick-list-title { color: #94a3b8; }
        body.dark .quick-slot-input { color: #e2e8f0; border-bottom-color: #334155; }
        body.dark .quick-slot-input::placeholder { color: #475569; }
        body.dark .subtask-check { border-color: #475569; }
        body.dark .subtask-emoji:hover { background: #334155; }
        body.dark .subtask-send { background: rgba(14, 165, 233, 0.15); }

        /* Master page */
        body.dark .project-section {
            background: #1e293b;
            border-color: #334155;
        }
        body.dark .project-section-name { color: #f1f5f9; }
        body.dark .project-section-count,
        body.dark .subtask-progress { background: #334155; color: #94a3b8; }
        body.dark .project-task-item { border-bottom-color: #334155; }
        body.dark .project-task-item:hover { background: rgba(14, 165, 233, 0.08); }

        /* Popups, modals, misc chrome */
        body.dark .team-popup {
            background: #1e293b;
            border-color: #334155;
        }
        body.dark .modal { background: #1e293b; color: #e2e8f0; }
        body.dark .modal h3 { color: #f1f5f9; }
        body.dark .toast { background: #334155; border: 1px solid #475569; }
        body.dark .instructions {
            background: rgba(15, 23, 42, 0.85);
            border-top-color: #1e293b;
        }
        /* .help-link is a filled brand-blue badge — needs no dark override */
        body.dark .user-switcher { background: #1e293b; border-color: #334155; }
        body.dark .add-new-icon { background: #334155; color: #94a3b8; }
        body.dark .empty-project { color: #64748b; }
    </style>
</head>
<body>
    <!-- Main App -->
    <div class="app-container" id="appContainer">
        <div class="app-header">
            <div class="app-logo">Move<span class="accent">Along</span></div>

            <!-- New project [+] -->
            <button class="project-add-btn" id="projectAddBtn" title="New project"><span class="accent">+</span>&nbsp;New project</button>

            <!-- Signup form (before Go) -->
            <div class="header-form" id="headerForm">
                <input type="text" class="header-input" id="signupName" placeholder="Your username">
                <input type="text" class="header-input auto-generated" id="signupCompany" placeholder="Project name">
                <button class="btn-go" id="signupBtn" disabled>Go</button>
            </div>

            <!-- Project tabs, in the user's own order. The active tab is
                 styled in place — it never moves to the front. -->
            <div id="projectTabs"></div>

            <!-- View toggle -->

    <script>
        // ============================================
        // API CONFIGURATION
        // ============================================
        const API_BASE = '/api';

        // ============================================
        // APP STATE
        // ============================================
        let isSignedUp = false;
        let company = { name: '', subdomain: '' };
        let allUsers = [];
        let currentUser = null;
        let tasks = [];
        let selectedDayIndex = 0;
        let projects = [];
        let currentProject = null;
        let viewMode = 'calendar'; // 'calendar' or 'master'
        // Row awaiting a deferred priority re-sort — see PRIORITY section below.
        // Declared up here because renderView() clears it and sits earlier in
        // the file than the rest of the priority code.
        let pendingPriorityRow = null;
        // Project tab reordering — declared here because renderProjectBar()
        // sits well above the drag code that maintains them.
        let draggedProjectId = null;
        let justDraggedProject = false;
        let expandedTaskIds = new Set();
        let taskSubtasks = new Map();
        function isExpandedTask(id) { return expandedTaskIds.has(id); }
        function toggleExpandedTask(id) {
            if (expandedTaskIds.has(id)) expandedTaskIds.delete(id);
            else expandedTaskIds.add(id);
        }
        let generatingSubtasksFor = null; // taskId currently generating
        let assistantEnabled = true; // master AI assistant switch (persisted in localStorage)

        // ===== "list ..." tasks: quick list above the standard AI pane =====
        const LIST_TASK_RE = /^list\b/i;
        function isListTask(desc) { return LIST_TASK_RE.test(desc || ''); }

        // ============================================
        // API HELPERS
        // ============================================
        // ============================================
        // SESSION PERSISTENCE (localStorage)
        // ============================================
        const SESSION_KEY = 'movealong.session';
        function saveSession() {
            try {
                if (!isSignedUp || !company.subdomain || !currentUser) {
                    localStorage.removeItem(SESSION_KEY);
                    return;
                }
                localStorage.setItem(SESSION_KEY, JSON.stringify({
                    subdomain: company.subdomain,
                    slug: currentUser.slug,
                    projectId: currentProject ? currentProject.id : null
                }));
            } catch (e) { /* ignore quota / disabled */ }
        }
        function loadSession() {
            try {
                const raw = localStorage.getItem(SESSION_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }
        function clearSession() {
            try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* ignore */ }
        }

        // AI assistant master switch preference (global, per-browser). Default ON:
        // only an explicit 'off' disables it, so existing users are unaffected.
        const ASSISTANT_KEY = 'movealong.assistant';
        function loadAssistantPref() {
            try {
                assistantEnabled = localStorage.getItem(ASSISTANT_KEY) !== 'off';
            } catch (e) { assistantEnabled = true; }
        }
        function saveAssistantPref() {
            try { localStorage.setItem(ASSISTANT_KEY, assistantEnabled ? 'on' : 'off'); } catch (e) { /* ignore */ }
        }

        // Optional AI access key: when the server sets AI_ACCESS_KEY, only
        // requests carrying it get real (billed) AI generation — everyone
        // else gets mock subtasks. Stored per browser; set via Shift+Click
        // on the 🧠 assistant toggle.
        const AI_KEY_STORAGE = 'movealong.aikey';
        function getAiKey() {
            try { return localStorage.getItem(AI_KEY_STORAGE) || ''; } catch (e) { return ''; }
        }

        async function api(endpoint, options = {}) {
            const url = `${API_BASE}${endpoint}`;
            const config = {
                headers: { 'Content-Type': 'application/json' },
                ...options
            };
            const aiKey = getAiKey();
            if (aiKey) config.headers['x-ai-key'] = aiKey;
            if (config.body && typeof config.body === 'object') {
                config.body = JSON.stringify(config.body);
            }
            const response = await fetch(url, config);
            if (!response.ok) {
                let message = 'HTTP ' + response.status;
                // Non-API errors (proxy pages, default 404s) aren't JSON.
                try { message = (await response.json()).error || message; } catch (e) { /* keep status */ }
                throw new Error(message);
            }
            return response.json();
        }

        // ============================================
        // DATE HELPERS
        // ============================================
        const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        // Build 30 day-cells starting from anchorKey (a YYYY-MM-DD string).
        // The anchor is normally today, but a locked task with a past-due
        // lock date pulls the anchor back so that day stays visible.
        function generateDays(anchorKey) {
            const todayKey = getTodayKey();
            const start = new Date((anchorKey || todayKey) + 'T00:00:00.000Z');
            const days = [];
            for (let i = 0; i < 30; i++) {
                const date = new Date(start);
                date.setUTCDate(start.getUTCDate() + i);
                const key = date.toISOString().split('T')[0];
                days.push({
                    date: date,
                    dayName: dayNames[date.getUTCDay()],
                    dateStr: `${monthNames[date.getUTCMonth()]} ${date.getUTCDate()}`,
                    key,
                    isToday: key === todayKey,
                    isOverdue: key < todayKey
                });
            }
            return days;
        }

        function getTodayKey() {
            return new Date().toISOString().split('T')[0];
        }

        // Earliest date the calendar should start on: today, unless a locked,
        // incomplete task is due on an earlier (past-due) date.
        function computeAnchorKey() {
            let anchor = getTodayKey();
            if (isSignedUp) {
                for (const t of tasks) {
                    if (t.locked && !t.completed && t.scheduled_date < anchor) {
                        anchor = t.scheduled_date;
                    }
                }
            }
            return anchor;
        }

        let days = generateDays(getTodayKey());

        function getTomorrowKey() {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            return tomorrow.toISOString().split('T')[0];
        }

        // ============================================
        // SIGNUP FLOW
        // ============================================
        const signupName = document.getElementById('signupName');
        const signupCompany = document.getElementById('signupCompany');
        const signupBtn = document.getElementById('signupBtn');
        const headerForm = document.getElementById('headerForm');
        const headerDisplay = document.getElementById('headerDisplay');
        const displayUsername = document.getElementById('displayUsername');
        const displayTeamName = document.getElementById('displayTeamName');
        let companyManuallyEdited = false;

        signupName.addEventListener('input', () => {
            const name = signupName.value.trim();
            if (!companyManuallyEdited && name) {
                signupCompany.value = `${name}'s Move Along`;
                signupCompany.classList.remove('user-edited');
            }
            validateSignup();
        });

        signupCompany.addEventListener('input', () => {
            companyManuallyEdited = true;
            signupCompany.classList.add('user-edited');
            validateSignup();
        });

        signupName.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (signupName.value.trim() && !signupCompany.value.trim()) {
                    signupCompany.focus();
                } else if (!signupBtn.disabled) {
                    signupBtn.click();
                }
            }
        });

        signupCompany.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !signupBtn.disabled) {
                e.preventDefault();
                signupBtn.click();
            }
        });

        function validateSignup() {
            const nameValid = signupName.value.trim().length > 0;
            const companyValid = signupCompany.value.trim().length > 0;
            signupBtn.disabled = !(nameValid && companyValid);
        }

        signupBtn.addEventListener('click', async () => {
            const userName = signupName.value.trim();
            const companyName = signupCompany.value.trim();

            signupBtn.disabled = true;
            signupBtn.textContent = '...';

            try {
                const result = await api('/companies', {
                    method: 'POST',
                    body: { companyName, userName }
                });

                company = result.company;
                currentUser = result.user;
                allUsers = [currentUser];
                isSignedUp = true;

                // Transform header
                headerForm.classList.add('hidden');
                headerDisplay.classList.add('visible');
                displayUsername.textContent = currentUser.name;
                displayTeamName.textContent = company.name;

                // Auto-create "Personal" project
                try {
                    const proj = await api(`/companies/${company.subdomain}/users/${currentUser.slug}/projects`, {
                        method: 'POST',
                        body: { name: 'Personal' }
                    });
                    projects = [proj];
                    currentProject = proj;
                } catch (e) {
                    console.error('Failed to create default project:', e);
                }

                renderProjectBar();
                renderBoard();
                saveSession();
                showToast('Ready to go!');

                const taskInput = document.querySelector('.task-input');
                if (taskInput) taskInput.focus();

            } catch (err) {
                showToast('Error: ' + err.message);
                signupBtn.disabled = false;
                signupBtn.textContent = 'Go';
            }
        });

        // ============================================
        // LOAD DATA
        // ============================================
        async function loadUsers() {
            try {
                allUsers = await api(`/companies/${company.subdomain}/users`);
            } catch (err) {
                console.error('Failed to load users:', err);
            }
        }

        async function loadProjects() {
            if (!currentUser) return;
            try {
                projects = await api(`/companies/${company.subdomain}/users/${currentUser.slug}/projects`);
                if (projects.length > 0 && !currentProject) {
                    currentProject = projects[0];
                }
            } catch (err) {
                console.error('Failed to load projects:', err);
            }
        }

        async function loadTasks() {
            if (!currentUser) return;
            try {
                let endpoint = `/companies/${company.subdomain}/users/${currentUser.slug}/tasks`;
                if (currentProject) {
                    endpoint += `?project_id=${currentProject.id}`;
                }
                tasks = await api(endpoint);
            } catch (err) {
                console.error('Failed to load tasks:', err);
                tasks = [];
            }
            // Deadlines on other boards can change from here (lock, complete,
            // move, switch project), so re-read the per-project due counts.
            await refreshProjectDueFlags();
        }

        // Re-read due_today for every project and repaint the tabs. Merges
        // into the existing list rather than replacing it, so currentProject
        // and any locally-pushed project object stay intact.
        async function refreshProjectDueFlags() {
            if (!currentUser || projects.length === 0) return;
            try {
                const fresh = await api(`/companies/${company.subdomain}/users/${currentUser.slug}/projects`);
                const counts = new Map(fresh.map(p => [p.id, p.due_today || 0]));
                projects.forEach(p => { p.due_today = counts.get(p.id) || 0; });
                renderProjectBar();
            } catch (err) {
                console.error('Failed to refresh project deadlines:', err);
            }
        }

        async function loadSubtasks(taskId) {
            try {
                const subtasks = await api(`/tasks/${taskId}/subtasks`);
                taskSubtasks.set(taskId, subtasks);
                return subtasks;
            } catch (err) {
                console.error('Failed to load subtasks:', err);
                return [];
            }
        }

        // ============================================
        // PROJECT OPERATIONS
        // ============================================
        async function createProject(name) {
            try {
                const proj = await api(`/companies/${company.subdomain}/users/${currentUser.slug}/projects`, {
                    method: 'POST',
                    body: { name }
                });
                projects.push(proj);
                currentProject = proj;
                await loadTasks();
                renderProjectBar();
                renderView();
                saveSession();
                showToast(`Project "${name}" created`);
            } catch (err) {
                showToast('Error: ' + err.message);
            }
        }

        async function switchProject(projectId) {
            currentProject = projects.find(p => p.id === projectId) || null;
            expandedTaskIds.clear();
            taskSubtasks.clear();
            await loadTasks();
            renderProjectBar();
            renderView();
            saveSession();
        }

        // ============================================
        // TASK OPERATIONS
        // ============================================
        let shouldRefocusInput = false;

        async function addTask(description, dateKey) {
            try {
                const body = { description, scheduled_date: dateKey };
                if (currentProject) body.project_id = currentProject.id;

                const newTask = await api(`/companies/${company.subdomain}/users/${currentUser.slug}/tasks`, {
                    method: 'POST',
                    body
                });
                tasks.push(newTask);
                shouldRefocusInput = true;

                if (newTask.scheduled_date !== dateKey) {
                    const requestedDay = days.find(d => d.key === dateKey);
                    const effectiveDay = days.find(d => d.key === newTask.scheduled_date);
                    const requestedName = requestedDay ? requestedDay.dayName : dateKey;
                    if (effectiveDay) {
                        showToast(`${requestedName} full — moved to ${effectiveDay.dayName}`);
                    } else {
                        const d = new Date(newTask.scheduled_date + 'T00:00:00.000Z');
                        const formatted = `${monthNames[d.getUTCMonth()]} ${d.getUTCDate()}`;
                        showToast(`All 30 days full — scheduled for ${formatted}`);
                    }
                }

                // Auto-generate subtasks (only when the AI assistant is enabled)
                if (assistantEnabled) {
                    expandedTaskIds.clear();
                    expandedTaskIds.add(newTask.id);
                    generatingSubtasksFor = newTask.id;
                    renderView();

                    try {
                        const subtasks = await api(`/tasks/${newTask.id}/generate-subtasks`, { method: 'POST' });
                        taskSubtasks.set(newTask.id, subtasks);
                    } catch (e) {
                        console.error('Failed to generate subtasks:', e);
                        taskSubtasks.set(newTask.id, []);
                    }
                    generatingSubtasksFor = null;
                    renderView();
                } else {
                    renderView();
                }

            } catch (err) {
                showToast('Error: ' + err.message);
            }
        }

        async function addTaskFromMaster(description, projectId) {
            try {
                const project = projects.find(p => p.id === projectId);
                if (!project) return;

                const body = { description, scheduled_date: getTodayKey(), project_id: projectId };
                const newTask = await api(`/companies/${company.subdomain}/users/${currentUser.slug}/tasks`, {
                    method: 'POST',
                    body
                });
                tasks.push(newTask);

                // Auto-generate subtasks (only when the AI assistant is enabled)
                if (assistantEnabled) {
                    generatingSubtasksFor = newTask.id;
                    expandedTaskIds.clear();
                    expandedTaskIds.add(newTask.id);
                    renderMasterPage();

                    try {
                        const subtasks = await api(`/tasks/${newTask.id}/generate-subtasks`, { method: 'POST' });
                        taskSubtasks.set(newTask.id, subtasks);
                    } catch (e) {
                        taskSubtasks.set(newTask.id, []);
                    }
                    generatingSubtasksFor = null;
                    renderMasterPage();
                } else {
                    renderMasterPage();
                }

            } catch (err) {
                showToast('Error: ' + err.message);
            }
        }

        async function toggleComplete(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            const willComplete = !task.completed;
            const wasChained = chainInfo.has(taskId);

            try {
                const updated = await api(`/tasks/${taskId}`, {
                    method: 'PUT',
                    body: { completed: willComplete }
                });
                Object.assign(task, updated);
                // Completing a task collapses its subtask pane (reopening leaves it closed).
                if (willComplete) {
                    expandedTaskIds.delete(taskId);
                }
                // Completing a chained task splices it out server-side (its
                // child re-links to its parent) — refetch so other rows'
                // parent_task_id changes land locally.
                if (willComplete && wasChained) {
                    await loadTasks();
                }
                renderView();
                showToast(task.completed ? 'Task completed!' : 'Task reopened');
            } catch (err) {
                showToast('Error: ' + err.message);
            }
        }

        async function moveTaskToDate(taskId, newDateKey) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            try {
                await api(`/tasks/${taskId}`, {
                    method: 'PUT',
                    body: { scheduled_date: newDateKey }
                });
                // Reload: moving a series member cascades to its successors.
                await loadTasks();
                renderView();
            } catch (err) {
                showToast('Error: ' + err.message);
            }
        }

        // Lock or unlock a task. When newDateKey is given, the task also moves
        // to that day and is pinned there (that date becomes the lock date).
        async function setTaskLock(taskId, locked, newDateKey) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;
            try {
                const body = { locked };
                if (newDateKey) body.scheduled_date = newDateKey;
                await api(`/tasks/${taskId}`, { method: 'PUT', body });
                // Reload: a date change on a series member cascades.
                await loadTasks();
                renderView();
            } catch (err) {
                showToast('Error: ' + err.message);
            }
        }

        // Popup for managing a task's lock: lock-to-this-day, pick a future
        // date, or unlock. Anchored under the clicked 📅/🔒 icon.
        function showLockPopup(e, taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;
            const popup = document.getElementById('lockPopup');
            const isLocked = !!task.locked;
            const minDate = getTodayKey();
            const dateVal = task.scheduled_date >= minDate ? task.scheduled_date : minDate;

            let html = '<div class="lock-popup-menu">';
            if (isLocked) {
                html += `<div class="lock-popup-title">Locked to ${task.scheduled_date}</div>`;
            } else {
                html += `<div class="lock-opt" data-act="lock-here">🔒 Lock to this day (${task.scheduled_date})</div>`;
            }
            html += `<div class="lock-popup-title">Lock to a future date</div>
                <div class="lock-popup-row">
                    <input type="date" id="lockDateInput" min="${minDate}" value="${dateVal}">
                    <button data-act="lock-date">Lock</button>
                </div>`;
            if (isLocked) {
                html += '<div class="lock-opt danger" data-act="unlock">🔓 Unlock</div>';
            }
            html += '</div>';
            popup.innerHTML = html;

            const rect = e.target.getBoundingClientRect();
            popup.style.left = rect.left + 'px';
            popup.style.top = (rect.bottom + 5) + 'px';
            popup.classList.add('visible');

            popup.querySelectorAll('[data-act]').forEach(el => {
                el.addEventListener('click', async (ev) => {
                    ev.stopPropagation();
                    const act = el.dataset.act;
                    if (act === 'lock-here') {
                        hidePopups();
                        await setTaskLock(taskId, true);
                        showToast('Locked to ' + task.scheduled_date);
                    } else if (act === 'lock-date') {
                        const val = document.getElementById('lockDateInput').value;
                        if (!val) { showToast('Pick a date'); return; }
                        hidePopups();
                        await setTaskLock(taskId, true, val);
                        showToast('Locked to ' + val);
                    } else if (act === 'unlock') {
                        hidePopups();
                        await setTaskLock(taskId, false);
                        showToast('Unlocked');
                    }
                });
            });

            document.addEventListener('click', hidePopupsOnClickOutside);
        }

        async function assignTaskToMember(taskId, toUserId) {
            try {
                const result = await api(`/tasks/${taskId}/assign`, {
                    method: 'POST',
                    body: { to_user_id: toUserId, scheduled_date: getTomorrowKey() }
                });
                // Update local task to show as assigned (forwarded) — keep it visible
                const task = tasks.find(t => t.id === taskId);
                if (task) {
                    task.assigned_to_id = toUserId;
                    const assignee = allUsers.find(u => u.id === toUserId);
                    task.assigned_to_name = assignee ? assignee.name : 'Someone';
                }
                renderView();
            } catch (err) {
                showToast('Error: ' + err.message);
            }
        }

        async function returnTask(taskId) {
            try {
                await api(`/tasks/${taskId}/return`, {
                    method: 'POST',
                    body: { scheduled_date: getTodayKey() }
                });
                tasks = tasks.filter(t => t.id !== taskId);
                renderView();
                showToast('Task returned');
            } catch (err) {
                showToast('Error: ' + err.message);
            }
        }

        async function createUserAndAssign(name, taskId) {
            try {
                const newUser = await api(`/companies/${company.subdomain}/users`, {
                    method: 'POST',
                    body: { name }
                });
                allUsers.push(newUser);
                await assignTaskToMember(taskId, newUser.id);
                return newUser;
            } catch (err) {
                showToast('Error: ' + err.message);
                throw err;
            }
        }

        // ============================================
        // SUBTASK OPERATIONS
        // ============================================
        async function toggleSubtaskComplete(subtaskId, taskId) {
            const subtasks = taskSubtasks.get(taskId);
            if (!subtasks) return;
            const st = subtasks.find(s => s.id === subtaskId);
            if (!st) return;

            try {
                const updated = await api(`/subtasks/${subtaskId}`, {
                    method: 'PUT',
                    body: { completed: !st.completed }
                });
                Object.assign(st, updated);
                renderView();
            } catch (err) {
                showToast('Error: ' + err.message);
            }
        }

        async function addQuickListItem(taskId, description) {
            try {
                const subtask = await api(`/tasks/${taskId}/subtasks`, {
                    method: 'POST',
                    body: { description, assignee_type: 'human' }
                });
                const existing = taskSubtasks.get(taskId) || [];
                existing.push(subtask);
                taskSubtasks.set(taskId, existing);
                renderView();
                // Keep the cursor in the next empty slot so a list can be rattled off.
                const slot = document.querySelector(`.quick-slot-input[data-task-id="${taskId}"]`);
                if (slot) slot.focus();
            } catch (err) {
                showToast('Error: ' + err.message);
            }
        }

        // ↑ on a list-pane suggestion: flip its assignee_type to 'human' so it
        // moves into "My list" (and survives suggestion regeneration).
        async function moveSuggestionToList(subtaskId, taskId) {
            const subtasks = taskSubtasks.get(taskId);
            if (!subtasks) return;
            const st = subtasks.find(s => s.id === subtaskId);
            if (!st) return;
            try {
                const updated = await api(`/subtasks/${subtaskId}`, {
                    method: 'PUT',
                    body: { assignee_type: 'human' }
                });
                Object.assign(st, updated);
                renderView();
            } catch (err) {
                showToast('Error: ' + err.message);
            }
        }

        async function addSubtask(taskId, description) {
            try {

                });
                const existing = taskSubtasks.get(taskId) || [];

        async function regenerateSubtasks(taskId) {

            renderView();

            try {

        async function assignSubtask(subtaskId, taskId, toUserId) {

                await api(`/subtasks/${subtaskId}/assign`, {

                renderView();
                const member = allUsers.find(u => u.id === toUserId);
                showToast(`Assigned to ${member ? member.name : 'team member'}`);
