        // ============================================
        // RENDER VIEW (dispatches to calendar or master)
        // ============================================
        function renderView() {
            // Any re-render replaces the rows, so a deferred priority sort has
            // nothing left to wait for — drop the pointer at its stale node.
            pendingPriorityRow = null;
            if (viewMode === 'master') {
                document.getElementById('board').style.display = 'none';
                document.getElementById('masterContainer').style.display = 'flex';
                renderMasterPage();
            } else {
                document.getElementById('board').style.display = 'flex';
                document.getElementById('masterContainer').style.display = 'none';
                renderBoard();
            }
        }

        // ============================================
        // RENDER PROJECT BAR
        // ============================================
        function renderProjectBar() {
            const tabs = document.getElementById('projectTabs');

            if (!isSignedUp || projects.length === 0) {
                tabs.innerHTML = '';
                return;
            }

            const activeId = currentProject ? currentProject.id : null;

            // Every project renders in the user's own order — selecting one
            // styles it in place rather than moving it to the front. A board
            // you're NOT on with a deadline due today (or past due) gets a
            // red border: the only nudge that another project needs you.
            tabs.innerHTML = projects.map(p => {
                const isActive = p.id === activeId;
                const due = !isActive && (p.due_today || 0) > 0 ? (p.due_today || 0) : 0;
                const title = due > 0
                    ? `${due} deadline${due === 1 ? '' : 's'} due — switch to ${p.name}`
                    : (isActive ? p.name : `Switch to ${p.name}`);
                const cls = `project-tab${isActive ? ' active' : ''}${due > 0 ? ' due' : ''}`;
                return `<span class="${cls}" draggable="true" data-project-id="${p.id}" title="${escapeHtml(title)}">${escapeHtml(p.name)}</span>`;
            }).join('');

            tabs.querySelectorAll('.project-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    // A completed drag doesn't fire click, but a drag that
                    // ends on the tab it started from can — ignore it.
                    if (justDraggedProject) return;
                    switchProject(parseInt(tab.dataset.projectId));
                });
                attachProjectTabDrag(tab);
            });
        }

        // ============================================
        // PROJECT TAB REORDERING (drag & drop)
        // ============================================
        // Tabs carry the user's own arrangement, so dragging one only
        // rewrites order — never the active board. Guarded against the
        // series drag (which sets draggedTaskId) so the two never mix.
        function attachProjectTabDrag(tab) {
            tab.addEventListener('dragstart', (e) => {
                draggedProjectId = parseInt(tab.dataset.projectId);
                // Safari refuses to start a drag without payload data.
                e.dataTransfer.setData('text/plain', `project:${draggedProjectId}`);
                e.dataTransfer.effectAllowed = 'move';
                tab.classList.add('dragging');
            });

            tab.addEventListener('dragend', () => {
                draggedProjectId = null;
                clearProjectDropMarkers();
                document.querySelectorAll('.project-tab.dragging')
                    .forEach(el => el.classList.remove('dragging'));
                // Swallow the click that can follow a drop on the origin tab.
                justDraggedProject = true;
                setTimeout(() => { justDraggedProject = false; }, 0);
            });

            tab.addEventListener('dragover', (e) => {
                if (!draggedProjectId) return;   // a task drag — not ours
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                const id = parseInt(tab.dataset.projectId);
                if (id === draggedProjectId) return;
                const rect = tab.getBoundingClientRect();
                const after = e.clientX > rect.left + rect.width / 2;
                clearProjectDropMarkers();
                tab.classList.add(after ? 'drop-after' : 'drop-before');
            });

            tab.addEventListener('dragleave', () => {
                tab.classList.remove('drop-before', 'drop-after');
            });

            tab.addEventListener('drop', (e) => {
                if (!draggedProjectId) return;
                e.preventDefault();
                e.stopPropagation();
                const targetId = parseInt(tab.dataset.projectId);
                const rect = tab.getBoundingClientRect();
                const after = e.clientX > rect.left + rect.width / 2;
                clearProjectDropMarkers();
                if (targetId !== draggedProjectId) {
                    reorderProjects(draggedProjectId, targetId, after);
                }
            });
        }

        function clearProjectDropMarkers() {
            document.querySelectorAll('.project-tab.drop-before, .project-tab.drop-after')
                .forEach(el => el.classList.remove('drop-before', 'drop-after'));
        }

        // Splice the dragged project in beside the target, repaint straight
        // away (optimistic — the bar should feel instant), then persist.
        async function reorderProjects(movedId, targetId, after) {
            const from = projects.findIndex(p => p.id === movedId);
            if (from === -1) return;
            const [moved] = projects.splice(from, 1);
            let to = projects.findIndex(p => p.id === targetId);
            if (to === -1) {
                projects.splice(from, 0, moved);   // target vanished — put it back
                return;
            }
            projects.splice(after ? to + 1 : to, 0, moved);
            renderProjectBar();

            try {
                await api(`/companies/${company.subdomain}/users/${currentUser.slug}/projects/order`, {
                    method: 'PUT',
                    body: { project_ids: projects.map(p => p.id) }
                });
            } catch (err) {
                console.error('Failed to save project order:', err);
                showToast('Could not save the new tab order');
            }
        }

        // ============================================
        // RENDER BOARD (Calendar View)
        // ============================================
        function renderBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            board.classList.remove('has-expanded');
            board.classList.remove('threading');
            computeChains();

            // Locked past-due tasks pull the calendar's first day back to their date.
            days = generateDays(computeAnchorKey());

            const myTasks = isSignedUp ? tasks : [];

            const placeholderTasks = [
                { id: 'p1', description: 'Add your username above', isPlaceholder: true },
                { id: 'p2', description: 'Add your team name above, e.g., Big Time Donuts Crew', isPlaceholder: true }
            ];

            days.forEach((day, index) => {
                const dayTasks = myTasks.filter(t => t.scheduled_date === day.key);
                // Priority sorts the pending list only — the completed and
                // assigned sections below the divider keep their own order.
                const pendingTasks = sortByPriority(dayTasks.filter(t => !t.completed && !t.assigned_to_id));
                const completedTasks = dayTasks.filter(t => t.completed);
                const assignedTasks = dayTasks.filter(t => t.assigned_to_id && !t.completed);

                const showPlaceholders = day.isToday && !isSignedUp;
                const showInput = isSignedUp;
                const isSelected = isSignedUp && index === selectedDayIndex;

                const card = document.createElement('div');
                card.className = `day-card dow-${day.dayName.toLowerCase()} ${day.isToday ? 'today' : ''} ${day.isOverdue ? 'overdue' : ''} ${isSelected ? 'selected' : ''}`;
                card.dataset.dayIndex = index;

                let tasksHtml = '';

                // Pending tasks
                if (showPlaceholders) {
                    tasksHtml += placeholderTasks.map(t => renderPlaceholderTask(t)).join('');
                }
                tasksHtml += pendingTasks.map(t => renderTask(t)).join('');

                // One-time whisper teaching drag-to-chain: today's card only,
                // once the board has 2+ pending tasks but no series yet.
                if (day.isToday && shouldShowChainHint()) {
                    tasksHtml += `
                        <div class="hint-chip">
                            <span>💡 Drag a task onto another to chain them into a series</span>
                            <span class="hint-dismiss" title="Dismiss">&#10005;</span>
                        </div>
                    `;
                }

                // Divider + completed
                const hasCompleted = completedTasks.length > 0;
                const hasAssigned = assignedTasks.length > 0;
                if (hasCompleted || hasAssigned) {
                    tasksHtml += '<hr class="task-divider">';
                    if (hasCompleted) {
                        tasksHtml += `<div class="completed-tasks">${completedTasks.map(t => renderTask(t)).join('')}</div>`;
                    }
                    if (hasAssigned) {
                        tasksHtml += `<div class="assigned-tasks">${assignedTasks.map(t => renderForwardedTask(t)).join('')}</div>`;
                    }
                }

                card.innerHTML = `
                    <div class="day-header-row">
                        <div class="day-header">${day.dayName}</div>
                        <div class="day-date">${day.dateStr}</div>
                    </div>
                    ${showInput ? `
                        <div class="task-input-container">
                            <input type="text" class="task-input" placeholder="Add a task..." data-date="${day.key}">
                        </div>
                    ` : ''}
                    <div class="tasks-container">
                        <div class="pending-tasks">${tasksHtml}</div>
                    </div>
                `;

                const column = document.createElement('div');
                column.className = 'day-column';
                column.appendChild(card);

                const expandedDayTasks = dayTasks.filter(t => expandedTaskIds.has(t.id));
                expandedDayTasks.forEach((expandedTask, paneIdx) => {
                    const paneWrapper = document.createElement('div');
                    paneWrapper.innerHTML = renderSubtaskPane(expandedTask.id, expandedTask.description, day.dayName);
                    const pane = paneWrapper.firstElementChild;
                    pane.classList.add('board-pane');
                    if (index >= days.length - 2) {
                        pane.classList.add('anchor-right');
                    }
                    column.appendChild(pane);
                    board.classList.add('has-expanded');
                });

                board.appendChild(column);
            });

            // Series thread overlay (drawn on hover, scrolls with the board).
            const overlay = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            overlay.id = 'chainOverlay';
            board.appendChild(overlay);

            if (isSignedUp) {
                renderUserSwitcher();
            }

            attachBoardListeners();
        }

            // Click on day card to select it

            // Series: hover a chained task to reveal its thread.

                });

            // Scissors icon → cut this task's link to its predecessor
            document.querySelectorAll('.task-unlink[data-task-id]').forEach(scissors => {
                scissors.addEventListener('click', (e) => {
                    e.stopPropagation();
                    unlinkTask(parseInt(scissors.dataset.taskId));
                });

            // Task description click → toggle subtask pane
            document.querySelectorAll('.task-description[data-task-id]').forEach(desc => {
                desc.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const taskId = parseInt(desc.dataset.taskId);

                    // Click on a URL → let the browser open it in a new tab;
                    // don't toggle the subtask pane.
                    if (e.target.closest('a.task-link')) return;

                    // Shift+Option+Click → quick-lock to this day (with confirm)
                    if (e.shiftKey && e.altKey) {
                        const task = tasks.find(t => t.id === taskId);
                        if (task && !task.completed) {
                            if (task.locked) {
                                showToast('Already locked to ' + task.scheduled_date);
                            } else if (confirm(`Lock "${task.description}" to ${task.scheduled_date}? The calendar won't advance past this day until it's done or moved.`)) {
                                await setTaskLock(taskId, true);
                                showToast('Locked to ' + task.scheduled_date);
                            }
                        }
                        return;
                    }

                    if (expandedTaskIds.has(taskId)) {
                        expandedTaskIds.delete(taskId);
                        renderView();
                    } else {

                        // pane. Same-day panes are absolutely positioned at the

                        expandedTaskIds.clear();
                        expandedTaskIds.add(taskId);
                        if (!taskSubtasks.has(taskId)) {
                            await loadSubtasks(taskId);

        function selectDay(index) {
            if (index < 0 || index >= days.length) return;
            selectedDayIndex = index;
            renderView();
            setTimeout(() => {
                const card = document.querySelector(`.day-card[data-day-index="${index}"]`);
                if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                const input = document.querySelector(`.task-input[data-date="${days[index].key}"]`);
                if (input) input.focus();
            }, 0);
        }

        // Inclusive day count since the task's origin day (added Monday → "5" on
        // Friday). Empty on the origin day itself. Locked tasks stay pinned to a
        // past date instead of spilling, so pending tasks count to max(scheduled,
        // today) — an overdue locked task keeps climbing daily. Completed tasks
        // freeze at the day they were completed on.
        // ============================================
        // SERIES (TASK CHAINS)
        // ============================================
        // Tasks link into linear series via parent_task_id (predecessor).
        // chainInfo maps task id → { chainId, countdown, color, tint }.
        // Countdown is position-from-end over the whole chain, so the first
        // step shows the series size and the last shows 1; numbers stay
        // stable when a middle step completes. No red/green: red is reserved
        // for overdue signals, and thread colors only appear on hover.
        const CHAIN_COLORS = [
            { color: '#8b5cf6', tint: '#f5f3ff' },
            { color: '#f97316', tint: '#fff7ed' },
            { color: '#d946ef', tint: '#fdf4ff' },
            { color: '#6366f1', tint: '#eef2ff' },
            { color: '#0891b2', tint: '#ecfeff' },
        ];
        let chainInfo = new Map();
        let draggedTaskId = null;

        function computeChains() {
            chainInfo = new Map();
            const byId = new Map(tasks.map(t => [t.id, t]));
            const childOf = new Map();
            tasks.forEach(t => {
                if (t.parent_task_id && byId.has(t.parent_task_id)) {
                    childOf.set(t.parent_task_id, t);
                }
            });
            tasks.forEach(t => {
                const hasKnownParent = t.parent_task_id && byId.has(t.parent_task_id);
                if (hasKnownParent || !childOf.has(t.id)) return;
                // t is a chain root: walk the series.
                const chain = [];
                const seen = new Set();
                let cur = t;
                while (cur && !seen.has(cur.id)) {
                    seen.add(cur.id);
                    chain.push(cur);
                    cur = childOf.get(cur.id);
                }
                if (chain.length < 2) return;
                const palette = CHAIN_COLORS[chain[0].id % CHAIN_COLORS.length];
                chain.forEach((member, i) => {
                    chainInfo.set(member.id, {
                        chainId: chain[0].id,
                        countdown: chain.length - i,
                        color: palette.color,
                        tint: palette.tint,
                    });
                });
            });
        }

        // Drop task A on task B → A becomes the step right after B and moves
        // to B's day + 1 (server-side).
        async function linkTask(taskId, parentTaskId) {
            try {
                await api(`/tasks/${taskId}/link`, {
                    method: 'POST',
                    body: { parent_task_id: parentTaskId }
                });
                await loadTasks();
                renderView();
                showToast('Added to series');
            } catch (err) {
                showToast('Error: ' + err.message);
            }
        }

        // Cut a task's link to its predecessor. Its own successors stay
        // attached — it becomes the root of a new, separate series.
        async function unlinkTask(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;
            if (!confirm(`Unlink "${task.description}" from the previous step?`)) return;
            try {
                await api(`/tasks/${taskId}/unlink`, { method: 'POST' });
                await loadTasks();
                renderView();
                showToast('Unlinked from series');
            } catch (err) {
                showToast('Error: ' + err.message);
            }
        }

        // The chain-teaching whisper shows until the user builds a series,
        // dismisses it, or has seen it in three sessions (stored count).
        // computeChains() has always run by the time renderBoard() asks.
        const CHAIN_HINT_KEY = 'movealong.hint.chain';
        const CHAIN_HINT_MAX_SHOWS = 3;
        let chainHintCountedThisSession = false;
        function shouldShowChainHint() {
            if (!isSignedUp) return false;
            let raw;
            try { raw = localStorage.getItem(CHAIN_HINT_KEY); } catch (e) { return false; }
            if (raw === 'dismissed') return false;
            const count = parseInt(raw || '0', 10) || 0;
            if (count >= CHAIN_HINT_MAX_SHOWS && !chainHintCountedThisSession) return false;
            if (chainInfo.size > 0) return false;
            if (tasks.filter(t => !t.completed && !t.assigned_to).length < 2) return false;
            // Count one appearance per session (renderBoard runs constantly).
            if (!chainHintCountedThisSession) {
                chainHintCountedThisSession = true;
                try { localStorage.setItem(CHAIN_HINT_KEY, String(count + 1)); } catch (e) { /* ignore */ }
            }
            return true;
        }

        function dismissChainHint() {
            try { localStorage.setItem(CHAIN_HINT_KEY, 'dismissed'); } catch (e) { /* ignore */ }
            renderBoard();
        }

        function clearChainThread() {
            const overlay = document.getElementById('chainOverlay');
            if (overlay) overlay.innerHTML = '';
            const board = document.getElementById('board');
            board.classList.remove('threading');
            document.querySelectorAll('.task-item.chain-active').forEach(el => {
                el.classList.remove('chain-active');
                el.style.background = '';
            });
        }

        // Hover-reveal: light up the hovered series, fade the rest, and draw
        // threads between consecutive members across the day cards.
        function drawChainThread(chainId) {
            clearChainThread();
            const board = document.getElementById('board');
            const overlay = document.getElementById('chainOverlay');
            if (!overlay) return;
            const members = [...board.querySelectorAll(`.task-item[data-chain-id="${chainId}"]`)]
                .sort((a, b) => Number(b.dataset.countdown) - Number(a.dataset.countdown));
            if (members.length < 2) return;

            const info = chainInfo.get(Number(members[0].dataset.id));
            const { color, tint } = info || CHAIN_COLORS[0];
            // Light mode uses the pastel tint; dark mode derives a translucent
            // wash from the chain color so pastels don't glare on dark cards.
            const isDark = document.body.classList.contains('dark');
            const bg = isDark
                ? `rgba(${parseInt(color.slice(1, 3), 16)}, ${parseInt(color.slice(3, 5), 16)}, ${parseInt(color.slice(5, 7), 16)}, 0.18)`
                : tint;
            board.classList.add('threading');
            members.forEach(el => {
                el.classList.add('chain-active');
                el.style.background = bg;
            });

            overlay.setAttribute('width', board.scrollWidth);
            overlay.setAttribute('height', board.scrollHeight);
            const boardRect = board.getBoundingClientRect();
            const offX = board.scrollLeft - boardRect.left;
            const offY = board.scrollTop - boardRect.top;

            const svgNS = 'http://www.w3.org/2000/svg';
            for (let i = 0; i < members.length - 1; i++) {
                const a = members[i].getBoundingClientRect();
                const b = members[i + 1].getBoundingClientRect();
                const x1 = a.right + offX, y1 = a.top + a.height / 2 + offY;
                const x2 = b.left + offX, y2 = b.top + b.height / 2 + offY;
                const mid = (x1 + x2) / 2;
                const path = document.createElementNS(svgNS, 'path');
                path.setAttribute('d', `M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`);
                path.setAttribute('fill', 'none');
                path.setAttribute('stroke', color);
                path.setAttribute('stroke-width', '1.5');
                path.setAttribute('opacity', '0.85');
                overlay.appendChild(path);
                const dot = document.createElementNS(svgNS, 'circle');
                dot.setAttribute('cx', x2);
                dot.setAttribute('cy', y2);
                dot.setAttribute('r', '2.5');
                dot.setAttribute('fill', color);
                overlay.appendChild(dot);
            }
        }

        // ============================================
        // HYPERLINKS IN TASK TEXT
        // ============================================
        // A task whose text contains a URL renders that URL as an anchor that
        // opens in a new tab. Only http(s)/www forms match, so `javascript:`
        // and friends can never become an href.
        const TASK_URL_RE = /(https?:\/\/[^\s<]+|www\.[^\s<]+)/gi;
        // Trailing sentence punctuation shouldn't be swallowed into the link.
        const URL_TRAILING_RE = /[.,;:!?)\]}'"]+$/;

        function escapeHtml(text) {
            return String(text ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // Escape everything, then wrap any URLs in anchors. draggable="false"
        // keeps the link from hijacking the task-item's series drag.
        function linkifyText(text) {
            const src = String(text ?? '');
            let out = '';
            let last = 0;
            let match;
            TASK_URL_RE.lastIndex = 0;
            while ((match = TASK_URL_RE.exec(src)) !== null) {
                const url = match[0].replace(URL_TRAILING_RE, '');
                if (!url) continue;
                out += escapeHtml(src.slice(last, match.index));
                const href = url.toLowerCase().startsWith('www.') ? 'https://' + url : url;
                out += `<a class="task-link" href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer" draggable="false" title="Open in a new tab">${escapeHtml(url)}</a>`;
                last = match.index + url.length;
                TASK_URL_RE.lastIndex = last;
            }
            out += escapeHtml(src.slice(last));
            return out;
        }

        function renderDayCounter(task) {
            if (!task.origin_date) return '';
            const todayKey = getTodayKey();
            const end = (!task.completed && task.scheduled_date < todayKey) ? todayKey : task.scheduled_date;
            const diff = Math.round((Date.parse(end + 'T00:00:00.000Z') - Date.parse(task.origin_date + 'T00:00:00.000Z')) / 86400000);
            if (diff < 1) return '';
            const count = diff + 1;
            return ` <span class="task-day-counter${count > 10 ? ' lagging' : ''}">${count}</span>`;
        }

        // Priority marks: 1-3 red "!" rendered right after the day counter.
        // Level 0 (the default for every task) renders nothing at all.
        function renderPriorityMarks(task) {
            if (task.completed) return '';
            const level = Math.min(3, Math.max(0, parseInt(task.priority, 10) || 0));
            if (!level) return '';
            const marks = '!'.repeat(level);
            return `<span class="task-priority" title="Priority ${level} — press 0 to clear">${marks}</span>`;
        }

        // Highest priority first; JS sort is stable, so tasks at the same level
        // keep the server's scheduled_date/created_at order.
        function sortByPriority(list) {
            return [...list].sort((a, b) => (parseInt(b.priority, 10) || 0) - (parseInt(a.priority, 10) || 0));
        }

        // ============================================
        // PRIORITY (hover + 1/2/3)
        // ============================================
        // The marks paint immediately, but the list does not re-sort until the
        // pointer leaves the row (pendingPriorityRow, declared in APP STATE) —
        // otherwise the row you are aiming at slides out from under the cursor
        // and a follow-up keystroke lands on its neighbour.

        // The row currently under the cursor, if it can take a priority.
        // Reads the live CSS :hover state, so the row that visibly changed
        // colour is exactly the row that gets flagged.
        function hoveredPriorityRow() {
            const row = document.querySelector('.task-item:hover, .project-task-item:hover');
            if (!row) return null;
            // Completed, assigned-away and placeholder rows are not eligible.
            if (row.classList.contains('completed') || row.classList.contains('forwarded') || row.classList.contains('placeholder')) return null;
            const id = parseInt(row.dataset.id, 10);
            if (!id) return null;
            return { row, id };
        }

        function priorityDescriptionEl(row) {
            return row.querySelector('.task-description') || row.querySelector('.project-task-desc');
        }

        function currentPriorityLevel(row) {
            const span = row.querySelector('.task-priority');
            return span ? span.textContent.length : 0;
        }

        // Optimistic paint: update the marks in place without a re-render, so
        // the row stays put while the user is still looking at it.
        function paintPriorityMarks(row, level) {
            const desc = priorityDescriptionEl(row);
            if (!desc) return;
            let span = row.querySelector('.task-priority');
            if (!level) {
                if (span) span.remove();
                return;
            }
            if (!span) {
                span = document.createElement('span');
                span.className = 'task-priority';
                const assignedLabel = desc.querySelector('.assigned-from');
                if (assignedLabel) desc.insertBefore(span, assignedLabel);
                else desc.appendChild(span);
            }
            span.textContent = '!'.repeat(level);
            span.title = `Priority ${level} — press 0 to clear`;
        }

        function schedulePrioritySort(row) {
            if (pendingPriorityRow === row) return;
            pendingPriorityRow = row;
            row.addEventListener('mouseleave', () => {
                if (pendingPriorityRow !== row) return;
                pendingPriorityRow = null;
                renderView();
            }, { once: true });
        }

        // Writes are chained per task so two fast keypresses (3 then 1) can't
        // land out of order and leave the server holding the earlier level.
        const priorityWrites = new Map();

        async function setPriority(taskId, level, row) {
            // The DOM is the source of truth for the current level: it is the
            // one place that is correct in both the board and the Main view.
            const next = (level === currentPriorityLevel(row)) ? 0 : level;

            const task = tasks.find(t => t.id === taskId);
            if (task) task.priority = next;
            paintPriorityMarks(row, next);
            schedulePrioritySort(row);

            const write = (priorityWrites.get(taskId) || Promise.resolve())
                .then(() => api(`/tasks/${taskId}`, { method: 'PUT', body: { priority: next } }))
                .then(updated => {
                    // Only the last write in the chain owns the local state.
                    if (task && priorityWrites.get(taskId) === write) Object.assign(task, updated);
                })
                .catch(err => showToast('Error: ' + err.message));

            priorityWrites.set(taskId, write);
            await write;
            if (priorityWrites.get(taskId) === write) priorityWrites.delete(taskId);
        }

        function renderTask(task) {
            const assignedLabel = task.assigned_by_name ? ` <span class="assigned-from">(from: ${escapeHtml(task.assigned_by_name)})</span>` : '';
            const returnButton = task.assigned_by ? `<div class="task-return" data-task-id="${task.id}" title="Return to sender">&cularr;</div>` : '';
            const isExpanded = expandedTaskIds.has(task.id);
            const isLocked = !!task.locked;
            const isLockedToday = isLocked && !task.completed && task.scheduled_date === getTodayKey();
            const regenerateButton = isExpanded
                ? `<button class="task-regenerate" data-task-id="${task.id}" title="Regenerate steps">&orarr;</button>`
                : '';
            // Lock control: only on pending (non-completed) tasks.
            const lockButton = task.completed
                ? ''
                : `<div class="task-lock ${isLocked ? 'locked' : ''}" data-task-id="${task.id}" title="${isLocked ? 'Locked — click to manage' : 'Lock to a date'}">${isLocked ? '🔒' : '📅'}</div>`;

            // Series: countdown number in the circle (steps left, first item =
            // series size); completed members show the check instead.
            const chain = chainInfo.get(task.id);
            const chainAttrs = chain ? ` data-chain-id="${chain.chainId}" data-countdown="${chain.countdown}"` : '';
            const circleContent = (chain && !task.completed) ? chain.countdown : '';
            const draggable = task.completed ? '' : ' draggable="true"';

            // Unlink: only for a task that has a predecessor in a live chain.
            // Cuts just this one edge — the task's own successors stay attached
            // and it becomes the root of a new, separate series.
            const unlinkButton = (chain && task.parent_task_id && !task.completed)
                ? `<div class="task-unlink" data-task-id="${task.id}" title="Unlink from previous step">&#9986;&#65039;</div>`
                : '';

            return `
                <div class="task-item ${task.completed ? 'completed' : ''} ${isExpanded ? 'expanded' : ''} ${isLocked ? 'locked' : ''} ${isLockedToday ? 'locked-today' : ''}" data-id="${task.id}"${chainAttrs}${draggable}>
                    <div class="task-circle" data-task-id="${task.id}">${circleContent}</div>
                    <div class="task-arrow" data-task-id="${task.id}">&rarr;</div>
                    <div class="task-description" data-task-id="${task.id}" title="Shift+Option+Click to lock to this day · hover and press 1-3 to prioritize">${linkifyText(task.description)}${renderDayCounter(task)}${renderPriorityMarks(task)}${assignedLabel}</div>
                    ${regenerateButton}
                    ${unlinkButton}
                    ${lockButton}
                    ${returnButton}
                </div>
            `;
        }

        function renderForwardedTask(task) {
            const assigneeName = task.assigned_to_name || 'someone';
            return `
                <div class="task-item forwarded" data-id="${task.id}">
                    <div class="task-circle"></div>
                    <div class="task-description">${escapeHtml(task.description)} <span class="assigned-to-label">&rarr; ${escapeHtml(assigneeName)}</span></div>
                </div>
            `;
        }

        function renderPlaceholderTask(task) {
            return `
                <div class="task-item placeholder">
                    <div class="task-circle"></div>
                    <div class="task-arrow">&rarr;</div>
                    <div class="task-description">${escapeHtml(task.description)}</div>
                </div>
            `;
        }

        // Extract a short bold "agent title" (verb-ish) from a subtask description.
        // Picks the first word, strips trailing punctuation, capitalizes. Falls back to "Step".
        const TITLE_STOPWORDS = new Set(['the', 'a', 'an', 'to', 'for', 'of', 'in', 'on', 'with', 'and', 'or', 'but']);
        function extractAgentTitle(description) {
            if (!description) return 'Step';
            const cleaned = description.replace(/^[^A-Za-z]+/, '');
            const firstWord = cleaned.split(/[\s—\-:,]/, 1)[0] || 'Step';
            const stripped = firstWord.replace(/[^A-Za-z]+$/, '');
            if (!stripped || TITLE_STOPWORDS.has(stripped.toLowerCase())) return 'Step';
            return stripped.charAt(0).toUpperCase() + stripped.slice(1).toLowerCase();
        }

        // ============================================
        // RENDER SUBTASK PANE
        // ============================================
        function renderSubtaskPane(taskId, taskTitle, dayName) {
            const isGenerating = generatingSubtasksFor === taskId;
            const subtasks = taskSubtasks.get(taskId) || [];

            let content = '';

            // Standard subtask row anatomy \u2014 shared by the normal pane and the
            // AI-suggestion section of "list ..." panes.
            const subtaskRow = (st, moveUp = false) => {
                const isDependent = st.parent_subtask_id !== null;
                const isAssigned = st.assigned_to !== null;
                const emoji = st.assignee_type === 'ai' ? '\uD83E\uDDE0' : '\uD83D\uDC69';
                // AI steps get a "send to agent" arrow \u2014 except list-pane suggestions,
                // where the slot holds an up arrow that moves the row onto "My list"
                // (send-to-agent is still a placeholder, so \u2191 replaces \u2192 there).
                const sendBtn = moveUp
                    ? `<button class="subtask-send subtask-up" data-subtask-id="${st.id}" data-task-id="${taskId}" title="Move to my list">&uarr;</button>`
                    : (st.assignee_type === 'ai' && !isAssigned)
                        ? `<button class="subtask-send" data-subtask-id="${st.id}" data-task-id="${taskId}" title="Send to AI agent">&rarr;</button>`
                        : '';
                const emojiEl = isAssigned
                    ? `<span class="subtask-emoji assigned">${emoji}</span>`
                    : `<span class="subtask-emoji" data-subtask-id="${st.id}" data-task-id="${taskId}" title="Assign this step">${emoji}</span>`;

                return `
                    <div class="subtask-item ${isDependent ? 'dependent' : ''} ${isAssigned ? 'assigned-subtask' : ''}">
                        <div class="subtask-check ${st.completed ? 'checked' : ''}" data-subtask-id="${st.id}" data-task-id="${taskId}">${st.completed ? '\u2713' : ''}</div>
                        ${emojiEl}
                        <div class="subtask-desc ${st.completed ? 'completed-subtask' : ''}">${linkifyText(st.description)}</div>
                        ${sendBtn}
                    </div>
                `;
            };

            const header = taskTitle
                ? `<div class="subtask-pane-header"><span class="subtask-pane-title">${escapeHtml(taskTitle)}</span></div>`
                : '';

            if (isGenerating) {
                content = `
                    <div class="subtask-loading">
                        <div class="dot-pulse"><span></span><span></span><span></span></div>
                        ${isListTask(taskTitle) ? 'Gathering ideas&hellip;' : 'Generating steps...'}
                    </div>
                `;
            } else if (isListTask(taskTitle)) {
                // Quick list on top (my items, assignee_type 'human'), standard
                // AI-generated subtask rows below (assignee_type 'ai').
                const mine = subtasks.filter(st => st.assignee_type !== 'ai' && !st.completed);
                const suggestions = subtasks.filter(st => st.assignee_type === 'ai' && !st.completed);

                const mineRows = mine.map(st => `
                    <div class="subtask-item">
                        <div class="subtask-check" data-subtask-id="${st.id}" data-task-id="${taskId}"></div>
                        <div class="subtask-desc">${linkifyText(st.description)}</div>
                    </div>
                `).join('');

                // 3 blank slots to start; once all three fill, one fresh slot follows each entry.
                let slots = '';
                const emptySlots = Math.max(3 - mine.length, 1);
                for (let i = 0; i < emptySlots; i++) {
                    slots += `
                        <div class="quick-slot">
                            <div class="subtask-check"></div>
                            <input type="text" class="quick-slot-input" data-task-id="${taskId}"
                                   placeholder="${i === 0 && !mine.length ? 'Add an item&hellip;' : ''}">
                        </div>
                    `;
                }

                const suggestionSection = suggestions.length
                    ? `<div class="quick-list-title">Suggestions</div><div class="subtask-list">${suggestions.map(st => subtaskRow(st, true)).join('')}</div>`
                    : '';

                const regenAll = `<button class="subtask-regenerate" data-task-id="${taskId}" title="Regenerate suggestions">&orarr;</button>`;
                content = `${regenAll}${header}<div class="quick-list-title">My list</div><div class="subtask-list">${mineRows}</div>${slots}${suggestionSection}`;
            } else {
                // Completed steps disappear from the pane (server keeps them for the List-view progress count).
                const pending = subtasks.filter(st => !st.completed);
                // Not pending.map(subtaskRow) — map's index argument would land in moveUp.
                const rows = pending.map(st => subtaskRow(st)).join('');

                const list = pending.length ? `<div class="subtask-list">${rows}</div>` : '';
                const regenAll = `<button class="subtask-regenerate" data-task-id="${taskId}" title="Regenerate all steps">&orarr;</button>`;
                content = `${regenAll}${header}${list}<input type="text" class="subtask-input" data-task-id="${taskId}" placeholder="Add a step...">`;
            }

            return `
                <div class="subtask-pane">
                    ${content}
                </div>
            `;
        }

        // ============================================
        // RENDER MASTER PAGE
        // ============================================
        async function renderMasterPage() {
            const container = document.getElementById('masterContainer');

            if (!isSignedUp) {
                container.innerHTML = '<div class="empty-project">Sign up to see your projects</div>';
                return;
            }

            // Load master data
            try {
                const data = await api(`/companies/${company.subdomain}/users/${currentUser.slug}/master`);
                const masterProjects = data.projects;

                if (masterProjects.length === 0) {
                    container.innerHTML = '<div class="empty-project">No projects yet. Create one above!</div>';
                    return;
                }

                container.innerHTML = masterProjects.map(proj => {
                    const taskListHtml = proj.tasks.length > 0
                        ? proj.tasks.map(t => {
                            const progress = t.subtask_count > 0
                                ? `<span class="subtask-progress">${t.completed_subtask_count}/${t.subtask_count}</span>`
                                : '';
                            const isExpanded = expandedTaskIds.has(t.id);

                            let subtaskHtml = '';
                            if (isExpanded) {
                                subtaskHtml = renderSubtaskPane(t.id, t.description);
                            }

                            return `
                                <div class="project-task-item" data-id="${t.id}">
                                    <div class="task-circle" data-task-id="${t.id}"></div>
                                    <div class="project-task-desc" data-task-id="${t.id}" title="Hover and press 1-3 to prioritize">${linkifyText(t.description)}${renderPriorityMarks(t)}</div>
                                    <span class="project-task-date${t.locked ? ' locked-date' : ''}">${t.scheduled_date}</span>
                                    ${progress}
                                </div>
                                ${subtaskHtml}
                            `;
                        }).join('')
                        : '<div class="empty-project">All caught up!</div>';

                    return `
                        <div class="project-section">
                            <div class="project-section-header">
                                <span class="project-section-name">${escapeHtml(proj.name)}</span>
                                <span class="project-section-count">${proj.tasks.length} open</span>
                            </div>
                            <input type="text" class="project-task-input" data-project-id="${proj.id}" placeholder="Add a task to ${escapeHtml(proj.name)}...">
                            <div class="project-task-list">${taskListHtml}</div>
                        </div>
                    `;
                }).join('');

                // Attach master page listeners
                container.querySelectorAll('.project-task-input').forEach(input => {
                    input.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter' && e.target.value.trim()) {
                            addTaskFromMaster(e.target.value.trim(), parseInt(e.target.dataset.projectId));
                            e.target.value = '';
                        }
                    });
                });

                container.querySelectorAll('.task-circle[data-task-id]').forEach(circle => {
                    circle.addEventListener('click', () => {
                        toggleComplete(parseInt(circle.dataset.taskId));
                    });
                });

                container.querySelectorAll('.project-task-desc[data-task-id]').forEach(desc => {
                    desc.addEventListener('click', async (e) => {
                        // Link clicks open in a new tab, they don't toggle the pane.
                        if (e.target.closest('a.task-link')) return;
                        const taskId = parseInt(desc.dataset.taskId);
                        if (expandedTaskIds.has(taskId)) {
                            expandedTaskIds.delete(taskId);
                        } else {
                            // Single-pane rule (matches the day board).
                            expandedTaskIds.clear();
                            expandedTaskIds.add(taskId);
                            if (!taskSubtasks.has(taskId)) {
                                await loadSubtasks(taskId);
                            }
                        }
                        renderMasterPage();
                    });
                });

                attachSubtaskListeners();
            } catch (err) {
                container.innerHTML = `<div class="empty-project">Error loading: ${escapeHtml(err.message)}</div>`;
            }
        }

        // ============================================
        // USER SWITCHER
        // ============================================
        function renderUserSwitcher() {
            const switcher = document.getElementById('userSwitcher');
            const container = document.getElementById('userSwitcherButtons');

            if (allUsers.length <= 1) {
                switcher.style.display = 'none';
                return;
            }

            switcher.style.display = 'flex';
            container.innerHTML = allUsers.map(user => `
                <div class="user-switch-btn ${user.id === currentUser.id ? 'active' : ''}" data-user-id="${user.id}">
                    <div class="user-switch-avatar" style="background: ${escapeHtml(user.color)}">${escapeHtml(user.initials)}</div>
                    <span class="user-switch-name">${escapeHtml(user.name)}</span>
                </div>
            `).join('');

            container.querySelectorAll('.user-switch-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const userId = parseInt(btn.dataset.userId);
                    currentUser = allUsers.find(u => u.id === userId);
                    expandedTaskIds.clear();
                    taskSubtasks.clear();
                    await loadProjects();
                    await loadTasks();
                    renderProjectBar();
                    renderView();
                    showToast(`Viewing as ${currentUser.name}`);
                });
            });
        }

        // ============================================
        // ARROW HANDLERS
        // ============================================
        function handleArrowClick(e) {
            e.stopPropagation();
            const taskId = parseInt(e.target.closest('.task-arrow').dataset.taskId);
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            // Locked tasks are deadlines — confirm before pushing them forward.
            // The lock follows the task to its new day.
            if (task.locked && !confirm(`"${task.description}" is locked to ${task.scheduled_date}. Move this deadline forward?`)) {
                return;
            }

            // Series members drag their later steps along with them.
            const chain = chainInfo.get(taskId);
            const seriesSuffix = (chain && chain.countdown > 1) ? ' — series follows' : '';

            // Shift+click: move forward one week
            if (e.shiftKey) {
                const currentDate = new Date(task.scheduled_date + 'T00:00:00.000Z');
                currentDate.setUTCDate(currentDate.getUTCDate() + 7);
                moveTaskToDate(taskId, currentDate.toISOString().split('T')[0]);
                showToast('Moved forward one week' + seriesSuffix);
                return;
            }

            // Regular click: move to next day
            const currentIndex = days.findIndex(d => d.key === task.scheduled_date);
            if (currentIndex !== -1 && currentIndex < days.length - 1) {
                moveTaskToDate(taskId, days[currentIndex + 1].key);
                showToast(`Moved to ${days[currentIndex + 1].dayName}` + seriesSuffix);
            } else if (currentIndex === -1) {
                // Task sits outside the current window — just add a day.
                const currentDate = new Date(task.scheduled_date + 'T00:00:00.000Z');
                currentDate.setUTCDate(currentDate.getUTCDate() + 1);
                moveTaskToDate(taskId, currentDate.toISOString().split('T')[0]);
                showToast('Moved to next day');
            }
        }

        // ============================================
        // TEAM POPUP (for subtask assignment)
        // ============================================
        let activeSubtaskId = null;
        let activeSubtaskTaskId = null;
        let activeTaskId = null;

        function showSubtaskAssignPopup(e, subtaskId, taskId) {
            activeSubtaskId = subtaskId;
            activeSubtaskTaskId = taskId;
            activeTaskId = null;
            showTeamPopupAt(e);
        }

        function showTeamPopup(e, taskId) {
            activeTaskId = taskId;
            activeSubtaskId = null;
            activeSubtaskTaskId = null;
            showTeamPopupAt(e);
        }

        function showTeamPopupAt(e) {
            const popup = document.getElementById('teamPopup');
            const teamMembers = allUsers.filter(u => u.id !== currentUser.id);

            let html = `<div class="team-popup-grid">
                <div class="add-new-member" id="addNewMemberBtn">
                    <div class="add-new-icon">+</div>
                    <div class="add-new-label">New</div>
                </div>`;

            html += teamMembers.map(member => `
                <div class="team-member" data-member-id="${member.id}">
                    <div class="team-avatar" style="background: ${escapeHtml(member.color)}">${escapeHtml(member.initials)}</div>
                    <div class="team-name">${escapeHtml(member.name)}</div>
                </div>
            `).join('');

            html += '</div>';
            popup.innerHTML = html;

            const rect = e.target.getBoundingClientRect();
            popup.style.left = rect.left + 'px';
            popup.style.top = (rect.bottom + 5) + 'px';
            popup.classList.add('visible');

            document.getElementById('addNewMemberBtn').addEventListener('click', () => {
                hidePopups();
                if (activeTaskId) {
                    showAddUserModal(activeTaskId);
                }
            });

            popup.querySelectorAll('.team-member').forEach(memberEl => {
                memberEl.addEventListener('click', async () => {
                    const memberId = parseInt(memberEl.dataset.memberId);
                    const member = allUsers.find(m => m.id === memberId);

                    if (activeSubtaskId && activeSubtaskTaskId) {
                        await assignSubtask(activeSubtaskId, activeSubtaskTaskId, memberId);
                    } else if (activeTaskId) {
                        await assignTaskToMember(activeTaskId, memberId);
                    }

                    hidePopups();
                    if (member) showToast(`Assigned to ${member.name}`);
                });
            });

            document.addEventListener('click', hidePopupsOnClickOutside);
        }

        // ============================================
        // ADD USER MODAL
        // ============================================
        const addUserModal = document.getElementById('addUserModal');
        const newUserName = document.getElementById('newUserName');
        const newUserLinkDisplay = document.getElementById('newUserLinkDisplay');
        const newUserLink = document.getElementById('newUserLink');
        const copyLinkBtn = document.getElementById('copyLinkBtn');
        const confirmAddUser = document.getElementById('confirmAddUser');
        const cancelAddUser = document.getElementById('cancelAddUser');
        let pendingAssignTaskId = null;
        let newUserCreated = null;

        function showAddUserModal(taskId) {
            pendingAssignTaskId = taskId;
            newUserCreated = null;
            newUserName.value = '';
            newUserLinkDisplay.style.display = 'none';
            confirmAddUser.textContent = 'Add & get link';
            confirmAddUser.disabled = false;
            addUserModal.classList.add('visible');
            newUserName.focus();
        }

        function hideAddUserModal() {
            addUserModal.classList.remove('visible');
            pendingAssignTaskId = null;
            newUserCreated = null;
        }

        cancelAddUser.addEventListener('click', hideAddUserModal);

        confirmAddUser.addEventListener('click', async () => {
            if (newUserCreated) {
                hideAddUserModal();
                showToast(`Assigned to ${newUserCreated.name}`);
                return;
            }

            const name = newUserName.value.trim();
            if (!name) { showToast('Please enter a name'); return; }

            confirmAddUser.disabled = true;
            confirmAddUser.textContent = '...';

            try {
                newUserCreated = await createUserAndAssign(name, pendingAssignTaskId);

                const fullUrl = `${company.subdomain}.movealong.com/${newUserCreated.slug}`;
                newUserLink.textContent = fullUrl;
                newUserLinkDisplay.style.display = 'block';
                confirmAddUser.textContent = 'Done';
                confirmAddUser.disabled = false;
                copyLinkBtn.textContent = 'Copy';
                copyLinkBtn.classList.remove('copied');
            } catch (err) {
                confirmAddUser.disabled = false;
                confirmAddUser.textContent = 'Add & get link';
            }
        });

        copyLinkBtn.addEventListener('click', () => {
            const url = newUserLink.textContent;
            navigator.clipboard.writeText(url).then(() => {
                copyLinkBtn.textContent = 'Copied!';
                copyLinkBtn.classList.add('copied');
            });
        });

        addUserModal.addEventListener('click', (e) => {
            if (e.target === addUserModal) hideAddUserModal();
        });

        // ============================================
        // CREATE PROJECT MODAL
        // ============================================
        const createProjectModal = document.getElementById('createProjectModal');
        const newProjectName = document.getElementById('newProjectName');
        const confirmCreateProject = document.getElementById('confirmCreateProject');
        const cancelCreateProject = document.getElementById('cancelCreateProject');

        document.getElementById('projectAddBtn').addEventListener('click', () => {
            newProjectName.value = '';
            createProjectModal.classList.add('visible');
            // Safari ignores focus() while the overlay is still visibility:hidden mid-transition.
            setTimeout(() => newProjectName.focus(), 50);
        });

        cancelCreateProject.addEventListener('click', () => {
            createProjectModal.classList.remove('visible');
        });

        confirmCreateProject.addEventListener('click', async () => {
            const name = newProjectName.value.trim();
            if (!name) { showToast('Please enter a name'); return; }
            createProjectModal.classList.remove('visible');
            await createProject(name);
        });

        newProjectName.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                confirmCreateProject.click();
            }
        });

        createProjectModal.addEventListener('click', (e) => {
            if (e.target === createProjectModal) createProjectModal.classList.remove('visible');
        });

        // ============================================
        // VIEW TOGGLE
        // ============================================
        document.getElementById('viewCalendarBtn').addEventListener('click', () => {
            viewMode = 'calendar';
            document.getElementById('viewCalendarBtn').classList.add('active');
            document.getElementById('viewMasterBtn').classList.remove('active');
            renderView();
        });

        document.getElementById('viewMasterBtn').addEventListener('click', () => {
            viewMode = 'master';
            document.getElementById('viewMasterBtn').classList.add('active');
            document.getElementById('viewCalendarBtn').classList.remove('active');
            renderView();
        });

        // ============================================
        // AI ASSISTANT MASTER SWITCH
        // ============================================
        function renderAssistantToggle() {
            const btn = document.getElementById('assistantToggleBtn');
            if (!btn) return;
            btn.classList.toggle('on', assistantEnabled);
            btn.setAttribute('aria-checked', assistantEnabled ? 'true' : 'false');
        }
        // Handler lives on the whole "🧠 Assistant [switch]" group, so
        // clicking the label or emoji works the same as the pill itself.
        document.querySelector('.assistant-switch').addEventListener('click', (e) => {
            // Shift+Click: set/clear the AI access key for this browser
            // (needed for real AI when the server sets AI_ACCESS_KEY).
            if (e.shiftKey) {
                const current = getAiKey();
                const entered = prompt(
                    current ? 'AI access key (empty to clear):' : 'AI access key:',
                    current
                );
                if (entered === null) return; // cancelled
                try {
                    if (entered.trim()) {
                        localStorage.setItem(AI_KEY_STORAGE, entered.trim());
                        showToast('AI access key saved');
                    } else {
                        localStorage.removeItem(AI_KEY_STORAGE);
                        showToast('AI access key cleared');
                    }
                } catch (err) { showToast('Could not save key'); }
                return;
            }
            assistantEnabled = !assistantEnabled;
            saveAssistantPref();
            renderAssistantToggle();
            showToast(assistantEnabled ? 'AI assistant on' : 'AI assistant off');
        });
        loadAssistantPref();
        renderAssistantToggle();

        // ============================================
        // THEME (dark / light)
        // ============================================
        const THEME_KEY = 'movealong.theme';
        function applyTheme(theme) {
            document.body.classList.toggle('dark', theme === 'dark');
            const btn = document.getElementById('themeToggleBtn');
            // Icon shows the theme you'd switch TO.
            if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
        }
        function loadTheme() {
            let theme = 'light';
            try { theme = localStorage.getItem(THEME_KEY) || 'light'; } catch (e) { /* default */ }
            applyTheme(theme);
        }
        document.getElementById('themeToggleBtn').addEventListener('click', () => {
            const next = document.body.classList.contains('dark') ? 'light' : 'dark';
            try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* session-only */ }
            applyTheme(next);
        });
        loadTheme();

        // ============================================
        // POPUP HELPERS
        // ============================================
        function hidePopups() {
            document.getElementById('teamPopup').classList.remove('visible');
            document.getElementById('lockPopup').classList.remove('visible');
            document.removeEventListener('click', hidePopupsOnClickOutside);
        }

        function hidePopupsOnClickOutside(e) {
            if (!e.target.closest('.team-popup') &&
                !e.target.closest('.subtask-emoji') &&
                !e.target.closest('.task-arrow') &&
                !e.target.closest('.task-lock') &&
                !e.target.closest('.modal')) {
                hidePopups();
            }
        }

        // ============================================
        // TOAST
        // ============================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('visible');
            setTimeout(() => {
                toast.classList.remove('visible');
            }, 2000);
        }

        // ============================================
        // INITIALIZE
        // ============================================
        async function restoreSession() {
            const saved = loadSession();
            if (!saved || !saved.subdomain || !saved.slug) {
                renderBoard();
                return;
            }
            try {
                const [companyData, userData] = await Promise.all([
                    api(`/companies/${saved.subdomain}`),
                    api(`/companies/${saved.subdomain}/users/${saved.slug}`)
                ]);
                company = companyData;
                currentUser = userData;
                allUsers = [currentUser];
                isSignedUp = true;

                headerForm.classList.add('hidden');
                headerDisplay.classList.add('visible');
                displayUsername.textContent = currentUser.name;
                displayTeamName.textContent = company.name;

                await loadProjects();
                if (saved.projectId) {
                    const match = projects.find(p => p.id === saved.projectId);
                    if (match) currentProject = match;
                }
                await loadTasks();
                renderProjectBar();
                renderBoard();
            } catch (err) {
                console.error('Failed to restore session:', err);
                clearSession();
                renderBoard();
            }
        }
        restoreSession();

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (!isSignedUp) return;

            // Escape closes subtask pane and modals
            if (e.key === 'Escape') {
                if (addUserModal.classList.contains('visible')) {
                    hideAddUserModal();
                } else if (createProjectModal.classList.contains('visible')) {
                    createProjectModal.classList.remove('visible');
                } else if (expandedTaskIds.size > 0) {
                    expandedTaskIds.clear();
                    renderView();
                }
                return;
            }

            // Priority: hover a pending task and press 1/2/3 (0 clears, and
            // pressing the level it already has toggles it off). This must run
            // before the type-to-focus fallback below, which would otherwise
            // send the digit into the add-task input. Works in both views, so
            // it sits above the calendar-only guard. Typing in a field wins.
            if (['0', '1', '2', '3'].includes(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) {
                const activeTag = (document.activeElement && document.activeElement.tagName) || '';
                const isEditing = activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT'
                    || (document.activeElement && document.activeElement.isContentEditable);
                if (!isEditing) {
                    const hovered = hoveredPriorityRow();
                    if (hovered) {
                        e.preventDefault();
                        setPriority(hovered.id, parseInt(e.key, 10), hovered.row);
                        return;
                    }
                }
            }

            // Arrow keys for day navigation (only in calendar view)
            if (viewMode !== 'calendar') return;
            if (e.key === 'ArrowRight') {
                e.preventDefault();
                selectDay(selectedDayIndex + 1);
                return;
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                selectDay(selectedDayIndex - 1);
                return;
            }

            // If user starts typing a printable character anywhere, focus the
            // currently selected day's task input so the keystroke lands there.
            const isPrintable = e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey;
            if (!isPrintable) return;
            const tag = (document.activeElement && document.activeElement.tagName) || '';
            const editable = document.activeElement && document.activeElement.isContentEditable;
            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || editable) return;
            const selectedKey = days[selectedDayIndex] && days[selectedDayIndex].key;
            if (!selectedKey) return;
            const input = document.querySelector(`.task-input[data-date="${selectedKey}"]`);
            if (input) input.focus();
        });
    </script>
</body>
</html>
