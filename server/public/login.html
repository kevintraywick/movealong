<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · MoveIt</title>
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="mask-icon" href="/favicon-mask.svg" color="#0ea5e9">
    <style>
        @font-face {
            font-family: 'Bricolage Grotesque';
            src: url('/fonts/bricolage-grotesque-800.woff2') format('woff2');
            font-weight: 800;
            font-display: swap;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px; color: #0f172a; background: #f8fafc;
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        form {
            width: 100%; max-width: 300px; display: flex; flex-direction: column; gap: 10px;
            background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 22px 20px 20px;
        }
        .wordmark {
            font-family: 'Bricolage Grotesque', -apple-system, sans-serif; font-weight: 800; font-size: 17px;
            letter-spacing: -0.03em; margin-bottom: 6px;
        }
        .wordmark span { color: #0ea5e9; }
        label { color: #64748b; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-bottom: 3px; }
        input {
            width: 100%; font: inherit; color: inherit; padding: 7px 9px;
            border: 1px solid #cbd5e1; border-radius: 6px; background-color: #fff; appearance: none;
        }
        input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px #e0f2fe; }
        button {
            margin-top: 6px; font: inherit; font-weight: 600; color: #fff; background: #0ea5e9;
            border: none; border-radius: 6px; padding: 8px; cursor: pointer;
        }
        button:hover { background: #0284c7; }
        .err { color: #ef4444; min-height: 1.2em; }
        .err:empty { display: none; }
        @media (prefers-color-scheme: dark) {
            body { background: #0f172a; color: #e2e8f0; }
            form { background: #1e293b; border-color: #334155; }
            .wordmark { color: #f1f5f9; }
            label { color: #94a3b8; }
            input { background-color: #0f172a; border-color: #475569; }
            input:focus { box-shadow: 0 0 0 3px #0c4a6e; }
        }
    </style>
</head>
<body>
    <form method="post" action="/login" autocomplete="on">
        <div class="wordmark">Move<span>It</span></div>
        <div class="err" id="err"></div>
        <div>
            <label for="u">User</label>
            <input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
        </div>
        <div>
            <label for="p">Password</label>
            <input id="p" name="password" type="password" autocomplete="current-password" required>
        </div>
        <input type="hidden" name="next" id="next" value="/">
        <button type="submit">Sign in</button>
    </form>
    <script>
        // ?next= is where to go after; ?bad=1 means the last try was wrong.
        // The server checks next again, so this only has to be convenient.
        const q = new URLSearchParams(location.search);
        const n = q.get('next') || '/';
        document.getElementById('next').value = /^\/(?!\/)/.test(n) ? n : '/';
        if (q.get('bad')) document.getElementById('err').textContent = 'That was not it. Try again.';
        if (q.get('slow')) document.getElementById('err').textContent = 'Too many tries. Wait ten minutes.';
    </script>
</body>
</html>
